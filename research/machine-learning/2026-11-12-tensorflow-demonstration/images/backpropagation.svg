<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 452" role="img" aria-labelledby="title desc"><title id="title">Dense network with dimensioned backward propagation</title><desc id="desc">A three-feature input maps through four hidden units to two outputs. Matrices have dimensions four by three and two by four under the article column-vector convention; Keras kernels use the transpose convention.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#69937c"/></marker><linearGradient id="heat"><stop stop-color="#688fa0"/><stop offset=".5" stop-color="#d88d55"/><stop offset="1" stop-color="#688fa0"/></linearGradient></defs><rect width="100%" height="100%" fill="#fffaf4"/><g font-family="system-ui,Segoe UI,sans-serif"><text x="30" y="36" font-size="24" fill="#233e35" text-anchor="start" font-weight="600">Backpropagation preserves the shape of each parameter</text><path d="M134 105 L411 105" fill="none" stroke="#d5dece" stroke-width="2.4"/><path d="M134 105 L411 159" fill="none" stroke="#d5dece" stroke-width="2.4"/><path d="M134 105 L411 213" fill="none" stroke="#d5dece" stroke-width="2.4"/><path d="M134 105 L411 267" fill="none" stroke="#d5dece" stroke-width="2.4"/><circle cx="115" cy="105" r="19" fill="#d6e6cd" stroke="#76917c"/><path d="M134 159 L411 105" fill="none" stroke="#d5dece" stroke-width="2.4"/><path d="M134 159 L411 159" fill="none" stroke="#d5dece" stroke-width="2.4"/><path d="M134 159 L411 213" fill="none" stroke="#d5dece" stroke-width="2.4"/><path d="M134 159 L411 267" fill="none" stroke="#d5dece" stroke-width="2.4"/><circle cx="115" cy="159" r="19" fill="#d6e6cd" stroke="#76917c"/><path d="M134 213 L411 105" fill="none" stroke="#d5dece" stroke-width="2.4"/><path d="M134 213 L411 159" fill="none" stroke="#d5dece" stroke-width="2.4"/><path d="M134 213 L411 213" fill="none" stroke="#d5dece" stroke-width="2.4"/><path d="M134 213 L411 267" fill="none" stroke="#d5dece" stroke-width="2.4"/><circle cx="115" cy="213" r="19" fill="#d6e6cd" stroke="#76917c"/><text x="115" y="325" font-size="19" fill="#233e35" text-anchor="middle" font-weight="600">a⁽⁰⁾ ∈ ℝ³</text><path d="M449 105 L726 105" fill="none" stroke="#d5dece" stroke-width="2.4"/><path d="M449 105 L726 159" fill="none" stroke="#d5dece" stroke-width="2.4"/><circle cx="430" cy="105" r="19" fill="#bdd6c0" stroke="#76917c"/><path d="M449 159 L726 105" fill="none" stroke="#d5dece" stroke-width="2.4"/><path d="M449 159 L726 159" fill="none" stroke="#d5dece" stroke-width="2.4"/><circle cx="430" cy="159" r="19" fill="#bdd6c0" stroke="#76917c"/><path d="M449 213 L726 105" fill="none" stroke="#d5dece" stroke-width="2.4"/><path d="M449 213 L726 159" fill="none" stroke="#d5dece" stroke-width="2.4"/><circle cx="430" cy="213" r="19" fill="#bdd6c0" stroke="#76917c"/><path d="M449 267 L726 105" fill="none" stroke="#d5dece" stroke-width="2.4"/><path d="M449 267 L726 159" fill="none" stroke="#d5dece" stroke-width="2.4"/><circle cx="430" cy="267" r="19" fill="#bdd6c0" stroke="#76917c"/><text x="430" y="325" font-size="19" fill="#233e35" text-anchor="middle" font-weight="600">a⁽¹⁾ ∈ ℝ⁴</text><circle cx="745" cy="105" r="19" fill="#d7c4ce" stroke="#76917c"/><circle cx="745" cy="159" r="19" fill="#d7c4ce" stroke="#76917c"/><text x="745" y="325" font-size="19" fill="#233e35" text-anchor="middle" font-weight="600">a⁽²⁾ ∈ ℝ²</text><text x="274" y="77" font-size="18" fill="#233e35" text-anchor="middle" font-weight="400">W⁽¹⁾: 4 × 3</text><text x="588" y="77" font-size="18" fill="#233e35" text-anchor="middle" font-weight="400">W⁽²⁾: 2 × 4</text><text x="918" y="114" font-size="20" fill="#233e35" text-anchor="middle" font-weight="400">Loss ℒ</text><path d="M769 132 L859 132" fill="none" stroke="#69937c" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="825" y="156" width="147" height="123" rx="12" fill="#f8eadc" stroke="#e0c6ad"/><text x="898" y="184" font-size="17" fill="#233e35" text-anchor="middle" font-weight="600">Reverse pass</text><text x="898" y="215" font-size="18" fill="#233e35" text-anchor="middle" font-weight="400">∂ℒ/∂W⁽²⁾</text><text x="898" y="241" font-size="16" fill="#233e35" text-anchor="middle" font-weight="400">has shape 2 × 4</text><text x="898" y="267" font-size="16" fill="#233e35" text-anchor="middle" font-weight="400">as does W⁽²⁾</text><path d="M740 365 L116 365" fill="none" stroke="#bc7959" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="430" y="397" font-size="21" fill="#233e35" text-anchor="middle" font-weight="400">δ⁽ℓ⁾ = (W⁽ℓ⁺¹⁾ᵀ δ⁽ℓ⁺¹⁾) ⊙ σ′(z⁽ℓ⁾)</text><text x="30" y="432" font-size="17" fill="#233e35" text-anchor="start" font-weight="400">Column-vector convention: z = Wa + b. Keras stores Dense kernels as (input width, output width).</text></g></svg>