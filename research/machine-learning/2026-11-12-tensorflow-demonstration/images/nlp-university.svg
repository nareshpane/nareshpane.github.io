66" height="42" rx="5" fill="#edf4e9" stroke="#c7d8bf" stroke-width="1"/><text x="716" y="179" font-size="12" text-anchor="middle" font-weight="400" fill="#2d4144">connect</text><text x="716" y="219" font-size="16" text-anchor="middle" font-weight="600" fill="#2d4144">28</text><rect x="755" y="153" width="66" height="42" rx="5" fill="#edf4e9" stroke="#c7d8bf" stroke-width="1"/><text x="788" y="179" font-size="12" text-anchor="middle" font-weight="400" fill="#2d4144">in</text><text x="788" y="219" font-size="16" text-anchor="middle" font-weight="600" fill="#2d4144">7</text><rect x="827" y="153" width="66" height="42" rx="5" fill="#edf4e9" stroke="#c7d8bf" stroke-width="1"/><text x="860" y="179" font-size="12" text-anchor="middle" font-weight="400" fill="#2d4144">the</text><text x="860" y="219" font-size="16" text-anchor="middle" font-weight="600" fill="#2d4144">3</text><rect x="899" y="153" width="66" height="42" rx="5" fill="#edf4e9" stroke="#c7d8bf" stroke-width="1"/><text x="932" y="179" font-size="12" text-anchor="middle" font-weight="400" fill="#2d4144">library</text><text x="932" y="219" font-size="16" text-anchor="middle" font-weight="600" fill="#2d4144">41</text><text x="467" y="245" font-size="13" text-anchor="start" font-weight="400" fill="#667b7a">Illustrative IDs; the training vocabulary determines real indices.</text><rect x="470" y="276" width="165" height="65" rx="7" fill="#eef4ed" stroke="#c5d5cc" stroke-width="1"/><text x="552.5" y="303" font-size="15" text-anchor="middle" font-weight="600" fill="#2d4144">Embedding lookup</text><text x="552.5" y="325" font-size="12" text-anchor="middle" font-weight="400" fill="#667b7a">7 × d vectors</text><path d="M638 309L652 309" fill="none" stroke="#91b09a" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#nlp-university-arrow)" /><rect x="656" y="276" width="139" height="65" rx="7" fill="#f1edf7" stroke="#c5d5cc" stroke-width="1"/><text x="725.5" y="303" font-size="15" text-anchor="middle" font-weight="600" fill="#2d4144">Masked pooling</text><text x="725.5" y="325" font-size="12" text-anchor="middle" font-weight="400" fill="#667b7a">one document vector</text><path d="M798 309L812 309" fill="none" stroke="#91b09a" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#nlp-university-arrow)" /><rect x="816" y="276" width="150" height="65" rx="7" fill="#edf5f8" stroke="#c5d5cc" stroke-width="1"/><text x="891.0" y="303" font-size="15" text-anchor="middle" font-weight="600" fill="#2d4144">Dense + softmax</text><text x="891.0" y="325" font-size="12" text-anchor="middle" font-weight="400" fill="#667b7a">4 categories</text><text x="25" y="380" font-size="15" text-anchor="start" font-weight="400" fill="#667b7a">Training-only vocabulary adaptation · explicit out-of-vocabulary token · padding excluded from pooled means</text></g></svg>