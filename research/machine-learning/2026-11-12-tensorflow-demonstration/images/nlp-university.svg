<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="nlp-university-title nlp-university-desc"><title id="nlp-university-title">Campus service requests move through token encoding embeddings and pooled classification</title><desc id="nlp-university-desc">An original university and student scene is paired with an ambiguous library laptop message. Illustrative token IDs flow into embedding lookup, masked pooling, and four-category softmax. Numerical IDs are not presented as a fitted vocabulary.</desc><defs><marker id="nlp-university-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c9781"/></marker><linearGradient id="nlp-university-thermal"><stop stop-color="#8fb4c3"/><stop offset=".25" stop-color="#d7cbb0"/><stop offset=".5" stop-color="#dd9877"/><stop offset=".75" stop-color="#d7cbb0"/><stop offset="1" stop-color="#8fb4c3"/></linearGradient><linearGradient id="nlp-university-soft-green" x2="0" y2="1"><stop stop-color="#cbe7ca"/><stop offset="1" stop-color="#e9f2df"/></linearGradient></defs><rect x="0" y="0" width="1000" height="400" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><g font-family="system-ui,Segoe UI,sans-serif"><text x="25" y="30" font-size="23" text-anchor="start" font-weight="600" fill="#2d4144">Intent comes from a message, not merely the building it mentions</text><g transform="translate(8 62) scale(1.25)"><ellipse cx="166" cy="156" rx="149" ry="17" fill="#f0f2eb"/><path d="M137 149Q140 172 205 181L244 181Q196 164 192 149Z" fill="#edf0e8" stroke="none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="32" y="72" width="101" height="69" rx="2" fill="#d9e4df" stroke="#a4b9ad" stroke-width="1"/><rect x="207" y="72" width="101" height="69" rx="2" fill="#d9e4df" stroke="#a4b9ad" stroke-width="1"/><path d="M24 72L83 48L141 72Z" fill="#d7b79c" stroke="#a6b5a9" stroke-width="1" stroke-linejoin="round" stroke-li