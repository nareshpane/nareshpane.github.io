<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 392" role="img" aria-labelledby="scientific-laboratory-title scientific-laboratory-desc"><title id="scientific-laboratory-title">A researcher studies a heated rod with fixed cool endpoints</title><desc id="scientific-laboratory-desc">An original geometric laboratory bench supports a thermally colored rod, a profile monitor, temperature sensor and researcher. The benchmark has zero-temperature endpoints, a sine initial condition and exponential heat decay on a nondimensional domain.</desc><defs><marker id="scientific-laboratory-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c9781"/></marker><linearGradient id="scientific-laboratory-thermal"><stop stop-color="#8fb4c3"/><stop offset=".25" stop-color="#d7cbb0"/><stop offset=".5" stop-color="#dd9877"/><stop offset=".75" stop-color="#d7cbb0"/><stop offset="1" stop-color="#8fb4c3"/></linearGradient><linearGradient id="scientific-laboratory-soft-green" x2="0" y2="1"><stop stop-color="#cbe7ca"/><stop offset="1" stop-color="#e9f2df"/></linearGradient></defs><rect x="0" y="0" width="1000" height="392" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><g font-family="system-ui,Segoe UI,sans-serif"><text x="25" y="30" font-size="23" text-anchor="start" font-weight="600" fill="#2d4144">A warm center cools while both ends are held at zero</text><g transform="translate(10 53) scale(1.65)"><path d="M19 158H318L297 180H42Z" fill="#e9e8e2" stroke="none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="36" y="121" width="263" height="10" rx="2" fill="#b3c8c1" stroke="#8da99e" stroke-width="1"/><path d="M53 131V172M282 131V172" fill="none" stroke="#8fa99e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="56" y="53" width="90" height="62" rx="3" fill="#ebf1ed" stroke="#6d9180" stroke-width="2"/><rect x="63" y="60" width="76" height="43" rx="1" fill="#fff" stroke="#bed3c4" stroke-width="1"/><path d="M68 95Q95 55 134 88" fill="none" stroke="#cf977c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M94 115v7M80 122h31" fill="none" stroke="#7a9c8b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="159" y="89" width="118" height="18" rx="7" fill="url(#scientific-laboratory-thermal)" stroke="#8d9f97" stroke-width="1"/><path d="M167 107v13M269 107v13" fill="none" stroke="#8e9f94" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M157 87v22M280 87v22" fill="none" stroke="#7da6b4" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M216 75L197 75" fill="none" stroke="#ad8c74" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#scientific-laboratory-arrow)" /><path d="M223 75L243 75" fill="none" stroke="#ad8c74" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#scientific-laboratory-arrow)" /><path d="M239 36v36M230 44h18M233 54h12" fill="none" stroke="#8aa79c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><circle cx="239" cy="78" r="8" fill="#ecd0b7" stroke="#8aa79c" stroke-width="1"/><g transform="translate(316 102) scale(0.8)"><ellipse cx="0" cy="77" rx="17" ry="4" fill="#e4eae4"/><path d="M-6 45L-8 72L-13 74M6 45L8 72L14 74" fill="none" stroke="#2d4144" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M-10 20Q0 16 10 20L13 48L-13 48Z" fill="#f3f5ee" stroke="#2d4144" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" /><path d="M-10 23L-17 42L-9 49" fill="none" stroke="#2d4144" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M10 23L22 32L29 19" fill="none" stroke="#2d4144" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><circle cx="0" cy="8" r="9" fill="#d8ac8b" stroke="#2d4144" stroke-width="1"/><path d="M-9 8Q-11-6 1-3Q11-2 10 8L6 4L4-1Q-1 6-9 8Z" fill="#2d4144" stroke="none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M-1 16V21" fill="none" stroke="#d8ac8b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M0 24L0 47" fill="none" stroke="#bbc7c3" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /><rect x="4" y="33" width="5" height="6" rx="1" fill="none" stroke="#abbab4" stroke-width="1"/></g></g><rect x="665" y="71" width="302" height="170" rx="9" fill="#f7f2fb" stroke="#d9cde6" stroke-width="1"/><text x="687" y="104" font-size="18" text-anchor="start" font-weight="600" fill="#2d4144">Reference experiment</text><text x="687" y="137" font-size="19" text-anchor="start" font-weight="400" fill="#2d4144">u(0, t) = u(1, t) = 0</text><text x="687" y="167" font-size="19" text-anchor="start" font-weight="400" fill="#2d4144">u(x, 0) = sin(πx)</text><text x="687" y="199" font-size="24" text-anchor="start" font-weight="600" fill="#2d4144">uₜ = κuₓₓ</text><text x="687" y="222" font-size="13" text-anchor="start" font-weight="400" fill="#667b7a">No internal heat source</text><text x="25" y="367" font-size="18" text-anchor="start" font-weight="500" fill="#2d4144">Exact field: u(x, t) = exp(−κπ²t) sin(πx)   ·   nondimensional position x and time t</text></g></svg>