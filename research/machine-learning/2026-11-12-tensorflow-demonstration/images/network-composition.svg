<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 379" role="img" aria-labelledby="network-composition-art-title network-composition-art-desc" id="network-composition-art"><title id="network-composition-art-title">A fully worked two-hidden-layer composition</title><desc id="network-composition-art-desc">Input1,2 passes through first affine map to minus1,4 then ReLU to0,4. A second affine map gives1,1 and ReLU leaves1,1. Output weights one half and one half give1. Groups0 input1 affine2 activation3 affine4 activation5 output enable controlled highlighting.</desc><defs><marker id="network-composition-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c9781"/></marker><linearGradient id="network-composition-thermal"><stop stop-color="#8fb4c3"/><stop offset=".25" stop-color="#d7cbb0"/><stop offset=".5" stop-color="#dd9877"/><stop offset=".75" stop-color="#d7cbb0"/><stop offset="1" stop-color="#8fb4c3"/></linearGradient><linearGradient id="network-composition-soft-green" x2="0" y2="1"><stop stop-color="#cbe7ca"/><stop offset="1" stop-color="#e9f2df"/></linearGradient></defs><rect x="0" y="0" width="1120" height="379" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><g font-family="system-ui,Segoe UI,sans-serif"><text x="560" y="29" font-size="23" text-anchor="middle" font-weight="600" fill="#2d4144">Two affine maps, two nonlinear maps, then a scalar readout</text><path d="M100 145L360 145" fill="none" stroke="#d2ded2" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" /><path d="M100 145L360 235" fill="none" stroke="#d2ded2" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" /><path d="M100 235L360 145" fill="none" stroke="#d2ded2" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" /><path d="M100 235L360 235" fill="none" stroke="#d2ded2" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" /><path d="M420 145L680 145" fill="none" stroke="#d2ded2" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" /><path d="M420 145L680 235" fill="none" stroke="#d2ded2" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" /><path d="M420 235L680 145" fill="none" stroke="#d2ded2" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" /><path d="M420 235L680 235" fill="none" stroke="#d2ded2" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" /><path d="M740 145L995 190" fill="none" stroke="#d2ded2" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" /><path d="M740 235L995 190" fill="none" stroke="#d2ded2" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" /><g class="network-stage" data-network-stage="0"><text x="70" y="83" font-size="12" text-anchor="middle" font-weight="650" fill="#667b7a">INPUT</text><circle cx="70" cy="145" r="28" fill="#edf5ea" stroke="#b1cbae" stroke-width="1.5"/><text x="70" y="152" font-size="22" text-anchor="middle" font-weight="600" fill="#2d4144">1</text><circle cx="70" cy="235" r="28" fill="#edf5ea" stroke="#b1cbae" stroke-width="1.5"/><text x="70" y="242" font-size="22" text-anchor="middle" font-weight="600" fill="#2d4144">2</text><text x="70" y="294" font-size="16" text-anchor="middle" font-weight="600" fill="#2d4144">x = [1, 2]</text></g><g class="network-stage" data-network-stage="1"><rect x="213" y="55" width="228" height="48" rx="8" fill="#f5f1e7" stroke="#d7ceba" stroke-width="1.2" class="stage-card"/><text x="327" y="77" font-size="18" text-anchor="middle" font-weight="600" fill="#2d4144">z¹ = W¹x + b¹</text><text x="327" y="95" font-size="13" text-anchor="middle" font-weight="400" fill="#2d4144">z¹ = [−1, 4]</text></g><g class="network-stage" data-network-stage="2"><text x="390" y="113" font-size="13" text-anchor="middle" font-weight="600" fill="#667b7a">ReLU</text><circle cx="390" cy="145" r="28" fill="#e3f0df" stroke="#9fbe9c" stroke-width="1.5"/><text x="390" y="152" font-size="22" text-anchor="middle" font-weight="600" fill="#2d4144">0</text><circle cx="390" cy="235" r="28" fill="#e3f0df" stroke="#9fbe9c" stroke-width="1.5"/><text x="390" y="242" font-size="22" text-anchor="middle" font-weight="600" fill="#2d4144">4</text><text x="390" y="294" font-size="16" text-anchor="middle" font-weight="600" fill="#2d4144">a¹ = [0, 4]</text><text x="390" y="317" font-size="13" text-anchor="middle" font-weight="400" fill="#667b7a">max(0, z¹)</text></g><g class="network-stage" data-network-stage="3"><rect x="530" y="55" width="228" height="48" rx="8" fill="#f4eff8" stroke="#d2c4df" stroke-width="1.2" class="stage-card"/><text x="644" y="77" font-size="18" text-anchor="middle" font-weight="600" fill="#2d4144">z² = W²a¹ + b²</text><text x="644" y="95" font-size="13" text-anchor="middle" font-weight="400" fill="#2d4144">z² = [1, 1]</text></g><g class="network-stage" data-network-stage="4"><text x="710" y="113" font-size="13" text-anchor="middle" font-weight="600" fill="#667b7a">ReLU</text><circle cx="710" cy="145" r="28" fill="#e8edf7" stroke="#b6c6d8" stroke-width="1.5"/><text x="710" y="152" font-size="22" text-anchor="middle" font-weight="600" fill="#2d4144">1</text><circle cx="710" cy="235" r="28" fill="#e8edf7" stroke="#b6c6d8" stroke-width="1.5"/><text x="710" y="242" font-size="22" text-anchor="middle" font-weight="600" fill="#2d4144">1</text><text x="710" y="294" font-size="16" text-anchor="middle" font-weight="600" fill="#2d4144">a² = [1, 1]</text><text x="710" y="317" font-size="13" text-anchor="middle" font-weight="400" fill="#667b7a">max(0, z²)</text></g><g class="network-stage" data-network-stage="5"><text x="1025" y="83" font-size="12" text-anchor="middle" font-weight="650" fill="#667b7a">OUTPUT</text><circle cx="1025" cy="190" r="31" fill="#f4e9d9" stroke="#d5bb9a" stroke-width="1.5"/><text x="1025" y="198" font-size="25" text-anchor="middle" font-weight="600" fill="#2d4144">1</text><text x="1025" y="294" font-size="16" text-anchor="middle" font-weight="600" fill="#2d4144">½a²₁ + ½a²₂</text></g><text x="560" y="359" font-size="15" text-anchor="middle" font-weight="400" fill="#667b7a">W¹ = [[1, −1], [2, 0.5]],  b¹ = [0, 1]     ·     W² = [[1, 0.25], [0, 0.5]],  b² = [0, −1]</text></g></svg>