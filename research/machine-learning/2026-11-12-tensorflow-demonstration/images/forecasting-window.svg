<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 441" role="img" aria-labelledby="title desc"><title id="title">Causal forecast window and chronological train validation calibration test partitions</title><desc id="desc">An origin o observes only days o minus 56 through o minus one and predicts days o through o plus six. Target windows stay within their chronological partition; past context may cross an earlier boundary.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#69937c"/></marker><linearGradient id="heat"><stop stop-color="#688fa0"/><stop offset=".5" stop-color="#d88d55"/><stop offset="1" stop-color="#688fa0"/></linearGradient></defs><rect width="100%" height="100%" fill="#fffaf4"/><g font-family="system-ui,Segoe UI,sans-serif"><text x="30" y="35" font-size="24" fill="#233e35" text-anchor="start" font-weight="600">Every forecast has an origin and an information boundary</text><rect x="35" y="83" width="581" height="73" rx="12" fill="#d6e7d4" stroke="#c5d7c7"/><text x="325" y="115" font-size="22" fill="#233e35" text-anchor="middle" font-weight="600">56 observed days</text><text x="325" y="141" font-size="17" fill="#233e35" text-anchor="middle" font-weight="400">Y[o−56], …, Y[o−1]</text><rect x="653" y="83" width="309" height="73" rx="12" fill="#e9d3bf" stroke="#d7b797"/><text x="807" y="115" font-size="22" fill="#233e35" text-anchor="middle" font-weight="600">7 future targets</text><text x="807" y="141" font-size="17" fill="#233e35" text-anchor="middle" font-weight="400">Y[o], …, Y[o+6]</text><path d="M35 185 L965 185" fill="none" stroke="#69937c" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M635 64 L635 218" fill="none" stroke="#a76a4e" stroke-width="2.4" stroke-dasharray="5 4"/><text x="635" y="243" font-size="18" fill="#233e35" text-anchor="middle" font-weight="600">origin o: first unobserved day</text><text x="35" y="282" font-size="19" fill="#233e35" text-anchor="start" font-weight="600">Chronological target partitions</text><rect x="35" y="300" width="365" height="56" rx="3" fill="#b6d1ad" stroke="#fffaf4"/><text x="217.5" y="335" font-size="16" fill="#233e35" text-anchor="middle" font-weight="600">TRAIN</text><rect x="400" y="300" width="180" height="56" rx="3" fill="#dcd6ab" stroke="#fffaf4"/><text x="490.0" y="335" font-size="16" fill="#233e35" text-anchor="middle" font-weight="600">VALIDATION</text><rect x="580" y="300" width="180" height="56" rx="3" fill="#d9c0ab" stroke="#fffaf4"/><text x="670.0" y="335" font-size="16" fill="#233e35" text-anchor="middle" font-weight="600">CALIBRATION</text><rect x="760" y="300" width="205" height="56" rx="3" fill="#bdcbd6" stroke="#fffaf4"/><text x="862.5" y="335" font-size="16" fill="#233e35" text-anchor="middle" font-weight="600">TEST</text><text x="35" y="390" font-size="17" fill="#233e35" text-anchor="start" font-weight="400">A target window must fit entirely inside its partition; past context may cross a boundary if already observed.</text><text x="35" y="418" font-size="17" fill="#233e35" text-anchor="start" font-weight="400">Means, scales and model selection use only their designated earlier periods. Future realized weather stays out.</text></g></svg>