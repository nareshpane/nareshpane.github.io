<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">From a scalar to an image batch</title><desc id="desc">Rank zero is one value, rank one is a vector, rank two a matrix. RGB image batches have batch, height, width and channel axes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#69937c"/></marker><linearGradient id="heat"><stop stop-color="#688fa0"/><stop offset=".5" stop-color="#d88d55"/><stop offset="1" stop-color="#688fa0"/></linearGradient></defs><rect width="100%" height="100%" fill="#fffaf4"/><g font-family="system-ui,Segoe UI,sans-serif"><text x="30" y="34" font-size="24" fill="#233e35" text-anchor="start" font-weight="600">A tensor is an array with a shape</text><text x="40" y="78" font-size="19" fill="#233e35" text-anchor="start" font-weight="600">Scalar</text><text x="40" y="300" font-size="17" fill="#233e35" text-anchor="start" font-weight="400">shape = ()</text><text x="245" y="78" font-size="19" fill="#233e35" text-anchor="start" font-weight="600">Vector</text><text x="245" y="300" font-size="17" fill="#233e35" text-anchor="start" font-weight="400">shape = (4,)</text><text x="460" y="78" font-size="19" fill="#233e35" text-anchor="start" font-weight="600">Matrix</text><text x="460" y="300" font-size="17" fill="#233e35" text-anchor="start" font-weight="400">shape = (3, 4)</text><text x="720" y="78" font-size="19" fill="#233e35" text-anchor="start" font-weight="600">Image batch</text><text x="720" y="300" font-size="17" fill="#233e35" text-anchor="start" font-weight="400">shape = (N, H, W, 3)</text><rect x="48" y="135" width="90" height="82" rx="12" fill="#e3edda" stroke="#c5d7c7"/><text x="93" y="187" font-size="29" fill="#233e35" text-anchor="middle" font-weight="400">7</text><rect x="245" y="153" width="35" height="48" rx="4" fill="#e3edda" stroke="#c5d7c7"/><text x="262" y="184" font-size="18" fill="#233e35" text-anchor="middle" font-weight="400">2</text><rect x="284" y="153" width="35" height="48" rx="4" fill="#e3edda" stroke="#c5d7c7"/><text x="301" y="184" font-size="18" fill="#233e35" text-anchor="middle" font-weight="400">4</text><rect x="323" y="153" width="35" height="48" rx="4" fill="#e3edda" stroke="#c5d7c7"/><text x="340" y="184" font-size="18" fill="#233e35" text-anchor="middle" font-weight="400">6</text><rect x="362" y="153" width="35" height="48" rx="4" fill="#e3edda" stroke="#c5d7c7"/><text x="379" y="184" font-size="18" fill="#233e35" text-anchor="middle" font-weight="400">8</text><rect x="460" y="116" width="39" height="39" rx="3" fill="#e6efdd" stroke="#c5d7c7"/><text x="479" y="142" font-size="16" fill="#233e35" text-anchor="middle" font-weight="400">1</text><rect x="503" y="116" width="39" height="39" rx="3" fill="#e6efdd" stroke="#c5d7c7"/><text x="522" y="142" font-size="16" fill="#233e35" text-anchor="middle" font-weight="400">2</text><rect x="546" y="116" width="39" height="39" rx="3" fill="#e6efdd" stroke="#c5d7c7"/><text x="565" y="142" font-size="16" fill="#233e35" text-anchor="middle" font-weight="400">3</text><rect x="589" y="116" width="39" height="39" rx="3" fill="#e6efdd" stroke="#c5d7c7"/><text x="608" y="142" font-size="16" fill="#233e35" text-anchor="middle" font-weight="400">4</text><rect x="460" y="159" width="39" height="39" rx="3" fill="#cee0c4" stroke="#c5d7c7"/><text x="479" y="185" font-size="16" fill="#233e35" text-anchor="middle" font-weight="400">5</text><rect x="503" y="159" width="39" height="39" rx="3" fill="#cee0c4" stroke="#c5d7c7"/><text x="522" y="185" font-size="16" fill="#233e35" text-anchor="middle" font-weight="400">6</text><rect x="546" y="159" width="39" height="39" rx="3" fill="#cee0c4" stroke="#c5d7c7"/><text x="565" y="185" font-size="16" fill="#233e35" text-anchor="middle" font-weight="400">7</text><rect x="589" y="159" width="39" height="39" rx="3" fill="#cee0c4" stroke="#c5d7c7"/><text x="608" y="185" font-size="16" fill="#233e35" text-anchor="middle" font-weight="400">8</text><rect x="460" y="202" width="39" height="39" rx="3" fill="#b8d2b1" stroke="#c5d7c7"/><text x="479" y="228" font-size="16" fill="#233e35" text-anchor="middle" font-weight="400">9</text><rect x="503" y="202" width="39" height="39" rx="3" fill="#b8d2b1" stroke="#c5d7c7"/><text x="522" y="228" font-size="16" fill="#233e35" text-anchor="middle" font-weight="400">10</text><rect x="546" y="202" width="39" height="39" rx="3" fill="#b8d2b1" stroke="#c5d7c7"/><text x="565" y="228" font-size="16" fill="#233e35" text-anchor="middle" font-weight="400">11</text><rect x="589" y="202" width="39" height="39" rx="3" fill="#b8d2b1" stroke="#c5d7c7"/><text x="608" y="228" font-size="16" fill="#233e35" text-anchor="middle" font-weight="400">12</text><rect x="794" y="100" width="113" height="107" rx="3" fill="#e5b4a5" stroke="#c5d7c7"/><path d="M822 100 L822 207" fill="none" stroke="#ffffff" stroke-width="2.4"/><path d="M794 127 L907 127" fill="none" stroke="#ffffff" stroke-width="2.4"/><path d="M850 100 L850 207" fill="none" stroke="#ffffff" stroke-width="2.4"/><path d="M794 154 L907 154" fill="none" stroke="#ffffff" stroke-width="2.4"/><path d="M878 100 L878 207" fill="none" stroke="#ffffff" stroke-width="2.4"/><path d="M794 181 L907 181" fill="none" stroke="#ffffff" stroke-width="2.4"/><rect x="774" y="115" width="113" height="107" rx="3" fill="#b7ccb4" stroke="#c5d7c7"/><path d="M802 115 L802 222" fill="none" stroke="#ffffff" stroke-width="2.4"/><path d="M774 142 L887 142" fill="none" stroke="#ffffff" stroke-width="2.4"/><path d="M830 115 L830 222" fill="none" stroke="#ffffff" stroke-width="2.4"/><path d="M774 169 L887 169" fill="none" stroke="#ffffff" stroke-width="2.4"/><path d="M858 115 L858 222" fill="none" stroke="#ffffff" stroke-width="2.4"/><path d="M774 196 L887 196" fill="none" stroke="#ffffff" stroke-width="2.4"/><rect x="754" y="130" width="113" height="107" rx="3" fill="#b9d2db" stroke="#c5d7c7"/><path d="M782 130 L782 237" fill="none" stroke="#ffffff" stroke-width="2.4"/><path d="M754 157 L867 157" fill="none" stroke="#ffffff" stroke-width="2.4"/><path d="M810 130 L810 237" fill="none" stroke="#ffffff" stroke-width="2.4"/><path d="M754 184 L867 184" fill="none" stroke="#ffffff" stroke-width="2.4"/><path d="M838 130 L838 237" fill="none" stroke="#ffffff" stroke-width="2.4"/><path d="M754 211 L867 211" fill="none" stroke="#ffffff" stroke-width="2.4"/><path d="M700 250 L918 250" fill="none" stroke="#69937c" stroke-width="2.4" marker-end="url(#arrow)"/><text x="809" y="274" font-size="15" fill="#233e35" text-anchor="middle" font-weight="400">width / column axis</text><text x="750" y="95" font-size="16" fill="#233e35" text-anchor="start" font-weight="400">R · G · B channels</text><text x="30" y="338" font-size="17" fill="#233e35" text-anchor="start" font-weight="400">Rank counts axes; shape records the length of every axis. A batch of 16 images is (16, 64, 64, 3).</text></g></svg>