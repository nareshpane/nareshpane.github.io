<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 452" role="img" id="computational-graph-art" aria-labelledby="computational-graph-art-title computational-graph-art-desc"><title id="computational-graph-art-title">Follow one prediction forward and one gradient backward</title><desc id="computational-graph-art-desc">Observed x equals two and y equals three. Trainable weight one and bias zero give prediction two and loss one half. Local derivatives yield weight gradient minus two and bias gradient minus one. Learning rate point one gives weight1.2 bias0.1 prediction2.5 and loss0.125, a 75 percent reduction for this step.</desc><defs><marker id="arrow-6b9882" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6b9882"/></marker><marker id="arrow-ba7861" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ba7861"/></marker></defs><g font-family="system-ui,Segoe UI,sans-serif"><text x="18" y="25" font-size="14" fill="#436e60" font-weight="650" text-anchor="start">A  FORWARD COMPUTATION</text><text x="1080" y="25" font-size="12" fill="#617475" font-weight="400" text-anchor="end">Solid arrows: values · dashed arrows: sensitivities</text><g class="graph-stage" data-graph-stage="0"><rect x="18" y="60" width="145" height="57" rx="8" fill="#edf5fb" stroke="#c4d6d4" stroke-width="1.2" class="stage-card"/><text x="90.5" y="80" font-size="10" fill="#30484c" font-weight="650" text-anchor="middle">OBSERVED INPUT</text><text x="90.5" y="103" font-size="18" fill="#30484c" font-weight="600" text-anchor="middle">x = 2</text><rect x="18" y="143" width="145" height="57" rx="8" fill="#edf6ea" stroke="#c4d6d4" stroke-width="1.2" class="stage-card"/><text x="90.5" y="163" font-size="10" fill="#30484c" font-weight="650" text-anchor="middle">TRAINABLE WEIGHT</text><text x="90.5" y="186" font-size="18" fill="#30484c" font-weight="600" text-anchor="middle">w = 1</text><rect x="420" y="48" width="155" height="57" rx="8" fill="#edf6ea" stroke="#c4d6d4" stroke-width="1.2" class="stage-card"/><text x="497.5" y="68" font-size="10" fill="#30484c" font-weight="650" text-anchor="middle">TRAINABLE BIAS</text><text x="497.5" y="91" font-size="18" fill="#30484c" font-weight="600" text-anchor="middle">b = 0</text><rect x="650" y="48" width="155" height="57" rx="8" fill="#edf5fb" stroke="#c4d6d4" stroke-width="1.2" class="stage-card"/><text x="727.5" y="68" font-size="10" fill="#30484c" font-weight="650" text-anchor="middle">OBSERVED TARGET</text><text x="727.5" y="91" font-size="18" fill="#30484c" font-weight="600" text-anchor="middle">y = 3</text></g><path d="M163 88L220 147" fill="none" stroke="#6b9882" stroke-width="1.8" marker-end="url(#arrow-6b9882)"/><path d="M163 170L220 160" fill="none" stroke="#6b9882" stroke-width="1.8" marker-end="url(#arrow-6b9882)"/><path d="M380 155H420" fill="none" stroke="#6b9882" stroke-width="1.8" marker-end="url(#arrow-6b9882)"/><path d="M575 155H650" fill="none" stroke="#6b9882" stroke-width="1.8" marker-end="url(#arrow-6b9882)"/><path d="M805 155H880" fill="none" stroke="#6b9882" stroke-width="1.8" marker-end="url(#arrow-6b9882)"/><path d="M497 105V124" fill="none" stroke="#6b9882" stroke-width="1.8" marker-end="url(#arrow-6b9882)"/><path d="M727 105V124" fill="none" stroke="#6b9882" stroke-width="1.8" marker-end="url(#arrow-6b9882)"/><g class="graph-stage" data-graph-stage="1"><rect x="220" y="126" width="155" height="65" rx="8" fill="#edf6ea" stroke="#c4d6d4" stroke-width="1.2" class="stage-card"/><text x="297.5" y="149" font-size="11" fill="#30484c" font-weight="650" text-anchor="middle">MULTIPLY</text><text x="297.5" y="177" font-size="20" fill="#30484c" font-weight="600" text-anchor="middle">wx = 2</text></g><g class="graph-stage" data-graph-stage="2"><rect x="420" y="126" width="155" height="65" rx="8" fill="#edf6ea" stroke="#c4d6d4" stroke-width="1.2" class="stage-card"/><text x="497.5" y="149" font-size="11" fill="#30484c" font-weight="650" text-anchor="middle">ADD BIAS</text><text x="497.5" y="177" font-size="20" fill="#30484c" font-weight="600" text-anchor="middle">a = 2 + 0</text></g><g class="graph-stage" data-graph-stage="3"><rect x="650" y="126" width="155" height="65" rx="8" fill="#edf5fb" stroke="#c4d6d4" stroke-width="1.2" class="stage-card"/><text x="727.5" y="149" font-size="11" fill="#30484c" font-weight="650" text-anchor="middle">COMPARE</text><text x="727.5" y="177" font-size="20" fill="#30484c" font-weight="600" text-anchor="middle">a − y = −1</text></g><g class="graph-stage" data-graph-stage="4"><rect x="880" y="126" width="155" height="65" rx="8" fill="#fff2e7" stroke="#c4d6d4" stroke-width="1.2" class="stage-card"/><text x="957.5" y="149" font-size="11" fill="#30484c" font-weight="650" text-anchor="middle">SQUARE / TWO</text><text x="957.5" y="177" font-size="20" fill="#30484c" font-weight="600" text-anchor="middle">ℒ = 0.5</text></g><g class="graph-stage" data-graph-stage="5"><text x="18" y="238" font-size="14" fill="#9c614d" font-weight="650" text-anchor="start">B  BACKWARD DIFFERENTIATION</text><path d="M958 198V254H498V277" fill="none" stroke="#ba7861" stroke-width="1.8" marker-end="url(#arrow-ba7861)" stroke-dasharray="5 4"/><text x="748" y="247" font-size="15" fill="#955c49" font-weight="400" text-anchor="middle">∂ℒ/∂a = a − y = −1</text><rect x="18" y="276" width="1062" height="65" rx="8" fill="#fff2e7" stroke="#e2cdb8" stroke-width="1.2" class="stage-card"/><text x="195" y="300" font-size="12" fill="#955c49" font-weight="650" text-anchor="middle">Local sensitivities</text><text x="195" y="326" font-size="17" fill="#30484c" font-weight="400" text-anchor="middle">∂a/∂w = x = 2;  ∂a/∂b = 1</text><text x="575" y="300" font-size="12" fill="#955c49" font-weight="650" text-anchor="middle">Weight: multiply along its path</text><text x="575" y="326" font-size="17" fill="#30484c" font-weight="400" text-anchor="middle">∂ℒ/∂w = (−1) × 2 = −2</text><text x="925" y="300" font-size="12" fill="#955c49" font-weight="650" text-anchor="middle">Bias: multiply along its path</text><text x="925" y="326" font-size="17" fill="#30484c" font-weight="400" text-anchor="middle">∂ℒ/∂b = (−1) × 1 = −1</text></g><g class="graph-stage" data-graph-stage="6"><text x="18" y="371" font-size="14" fill="#436e60" font-weight="650" text-anchor="start">C  UPDATE AND RECOMPUTE · η = 0.1</text><rect x="18" y="386" width="390" height="53" rx="8" fill="#f7f8f7" stroke="#d5ded8" stroke-width="1.2" class="stage-card"/><text x="213" y="407" font-size="10" fill="#30484c" font-weight="650" text-anchor="middle">BEFORE</text><text x="213" y="429" font-size="17" fill="#30484c" font-weight="400" text-anchor="middle">w = 1; b = 0; a = 2; ℒ = 0.5</text><path d="M412 412H455" fill="none" stroke="#6b9882" stroke-width="1.8" marker-end="url(#arrow-6b9882)"/><rect x="465" y="386" width="615" height="53" rx="8" fill="#edf6ea" stroke="#bdd3b6" stroke-width="1.2" class="stage-card"/><text x="773" y="407" font-size="10" fill="#30484c" font-weight="650" text-anchor="middle">AFTER: SUBTRACT THE ORIGINAL GRADIENTS</text><text x="773" y="429" font-size="17" fill="#30484c" font-weight="400" text-anchor="middle">w = 1.2; b = 0.1; a = 2.5; ℒ = 0.125  (75% lower)</text></g></g></svg>