<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 394" role="img" aria-labelledby="title desc"><title id="title">A fully worked three by three cross-correlation</title><desc id="desc">Input entries one through nine are multiplied by a vertical edge filter with rows one zero minus one. The sum is minus six. TensorFlow Conv2D uses cross-correlation without flipping the kernel.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71927b"/></marker></defs><rect width="1000" height="394" fill="#fffaf4"/><g font-family="system-ui,Segoe UI,sans-serif"><text x="30" y="35" font-size="24" fill="#233e35" text-anchor="start" font-weight="600">Cross-correlation: multiply corresponding entries, then add</text><text x="134" y="83" font-size="19" fill="#233e35" text-anchor="middle" font-weight="600">Input patch</text><rect x="50" y="105" width="52" height="52" rx="7" fill="#dbe7ce" stroke="#c4d5c0"/><text x="76" y="138" font-size="22" fill="#233e35" text-anchor="middle" font-weight="400">1</text><rect x="108" y="105" width="52" height="52" rx="7" fill="#dbe7ce" stroke="#c4d5c0"/><text x="134" y="138" font-size="22" fill="#233e35" text-anchor="middle" font-weight="400">2</text><rect x="166" y="105" width="52" height="52" rx="7" fill="#dbe7ce" stroke="#c4d5c0"/><text x="192" y="138" font-size="22" fill="#233e35" text-anchor="middle" font-weight="400">3</text><rect x="50" y="163" width="52" height="52" rx="7" fill="#dbe7ce" stroke="#c4d5c0"/><text x="76" y="196" font-size="22" fill="#233e35" text-anchor="middle" font-weight="400">4</text><rect x="108" y="163" width="52" height="52" rx="7" fill="#dbe7ce" stroke="#c4d5c0"/><text x="134" y="196" font-size="22" fill="#233e35" text-anchor="middle" font-weight="400">5</text><rect x="166" y="163" width="52" height="52" rx="7" fill="#dbe7ce" stroke="#c4d5c0"/><text x="192" y="196" font-size="22" fill="#233e35" text-anchor="middle" font-weight="400">6</text><rect x="50" y="221" width="52" height="52" rx="7" fill="#dbe7ce" stroke="#c4d5c0"/><text x="76" y="254" font-size="22" fill="#233e35" text-anchor="middle" font-weight="400">7</text><rect x="108" y="221" width="52" height="52" rx="7" fill="#dbe7ce" stroke="#c4d5c0"/><text x="134" y="254" font-size="22" fill="#233e35" text-anchor="middle" font-weight="400">8</text><rect x="166" y="221" width="52" height="52" rx="7" fill="#dbe7ce" stroke="#c4d5c0"/><text x="192" y="254" font-size="22" fill="#233e35" text-anchor="middle" font-weight="400">9</text><text x="454" y="83" font-size="19" fill="#233e35" text-anchor="middle" font-weight="600">Kernel</text><rect x="370" y="105" width="52" height="52" rx="7" fill="#eadbc8" stroke="#c4d5c0"/><text x="396" y="138" font-size="22" fill="#233e35" text-anchor="middle" font-weight="400">1</text><rect x="428" y="105" width="52" height="52" rx="7" fill="#eadbc8" stroke="#c4d5c0"/><text x="454" y="138" font-size="22" fill="#233e35" text-anchor="middle" font-weight="400">0</text><rect x="486" y="105" width="52" height="52" rx="7" fill="#eadbc8" stroke="#c4d5c0"/><text x="512" y="138" font-size="22" fill="#233e35" text-anchor="middle" font-weight="400">-1</text><rect x="370" y="163" width="52" height="52" rx="7" fill="#eadbc8" stroke="#c4d5c0"/><text x="396" y="196" font-size="22" fill="#233e35" text-anchor="middle" font-weight="400">1</text><rect x="428" y="163" width="52" height="52" rx="7" fill="#eadbc8" stroke="#c4d5c0"/><text x="454" y="196" font-size="22" fill="#233e35" text-anchor="middle" font-weight="400">0</text><rect x="486" y="163" width="52" height="52" rx="7" fill="#eadbc8" stroke="#c4d5c0"/><text x="512" y="196" font-size="22" fill="#233e35" text-anchor="middle" font-weight="400">-1</text><rect x="370" y="221" width="52" height="52" rx="7" fill="#eadbc8" stroke="#c4d5c0"/><text x="396" y="254" font-size="22" fill="#233e35" text-anchor="middle" font-weight="400">1</text><rect x="428" y="221" width="52" height="52" rx="7" fill="#eadbc8" stroke="#c4d5c0"/><text x="454" y="254" font-size="22" fill="#233e35" text-anchor="middle" font-weight="400">0</text><rect x="486" y="221" width="52" height="52" rx="7" fill="#eadbc8" stroke="#c4d5c0"/><text x="512" y="254" font-size="22" fill="#233e35" text-anchor="middle" font-weight="400">-1</text><text x="296" y="208" font-size="37" fill="#233e35" text-anchor="middle" font-weight="400">⊙</text><path d="M568 187L665 187" stroke="#71927b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="700" y="134" width="186" height="106" rx="7" fill="#c8dec9" stroke="#c4d5c0"/><text x="793" y="175" font-size="17" fill="#233e35" text-anchor="middle" font-weight="400">Feature response</text><text x="793" y="214" font-size="31" fill="#233e35" text-anchor="middle" font-weight="600">−6</text><text x="500" y="327" font-size="21" fill="#233e35" text-anchor="middle" font-weight="400">(1 − 3) + (4 − 6) + (7 − 9) = −2 − 2 − 2 = −6</text><text x="30" y="371" font-size="17" fill="#233e35" text-anchor="start" font-weight="400">Conv2D uses this unflipped-kernel convention; mathematical convolution would reverse the kernel first.</text></g></svg>