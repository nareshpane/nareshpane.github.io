<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 475" role="img" id="pipeline-art" aria-labelledby="pipeline-art-title pipeline-art-desc"><title id="pipeline-art-title">The same mathematical pipeline; different software responsibilities</title><desc id="pipeline-art-desc">Two aligned lanes compare custom coordination with TensorFlow integration. Four callouts distinguish integrated data pipelines, optimized tensor computation, automatic differentiation, and less custom training infrastructure. These are capabilities, not measured speed or accuracy gains.</desc><defs><marker id="arrow-6b9882" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6b9882"/></marker><marker id="arrow-ba7861" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ba7861"/></marker></defs><g font-family="system-ui,Segoe UI,sans-serif"><text x="600" y="29" font-size="23" fill="#30484c" font-weight="600" text-anchor="middle">The same mathematical pipeline; different software responsibilities</text><text x="18" y="59" font-size="17" fill="#30484c" font-weight="600" text-anchor="start">Custom or manually coordinated pipeline</text><rect x="18" y="78" width="154" height="75" rx="8" fill="#fff2e7" stroke="#e2cdb8" stroke-width="1.2" class=""/><text x="95" y="106" font-size="16" fill="#30484c" font-weight="600" text-anchor="middle">Image files</text><text x="95" y="132" font-size="12" fill="#30484c" font-weight="400" text-anchor="middle">Select records</text><path d="M173 115H183" fill="none" stroke="#6b9882" stroke-width="1.8" marker-end="url(#arrow-6b9882)"/><rect x="186" y="78" width="154" height="75" rx="8" fill="#fff2e7" stroke="#e2cdb8" stroke-width="1.2" class=""/><text x="263" y="106" font-size="16" fill="#30484c" font-weight="600" text-anchor="middle">Decode</text><text x="263" y="132" font-size="12" fill="#30484c" font-weight="400" text-anchor="middle">Reader + checks</text><path d="M341 115H351" fill="none" stroke="#6b9882" stroke-width="1.8" marker-end="url(#arrow-6b9882)"/><rect x="354" y="78" width="154" height="75" rx="8" fill="#fff2e7" stroke="#e2cdb8" stroke-width="1.2" class=""/><text x="431" y="106" font-size="16" fill="#30484c" font-weight="600" text-anchor="middle">Normalize</text><text x="431" y="132" font-size="12" fill="#30484c" font-weight="400" text-anchor="middle">NumPy / OpenCV</text><path d="M509 115H519" fill="none" stroke="#6b9882" stroke-width="1.8" marker-end="url(#arrow-6b9882)"/><rect x="522" y="78" width="154" height="75" rx="8" fill="#fff2e7" stroke="#e2cdb8" stroke-width="1.2" class=""/><text x="599" y="106" font-size="16" fill="#30484c" font-weight="600" text-anchor="middle">Batch</text><text x="599" y="132" font-size="12" fill="#30484c" font-weight="400" text-anchor="middle">Stack + iterate</text><path d="M677 115H687" fill="none" stroke="#6b9882" stroke-width="1.8" marker-end="url(#arrow-6b9882)"/><rect x="690" y="78" width="154" height="75" rx="8" fill="#fff2e7" stroke="#e2cdb8" stroke-width="1.2" class=""/><text x="767" y="106" font-size="16" fill="#30484c" font-weight="600" text-anchor="middle">Convolve</text><text x="767" y="132" font-size="12" fill="#30484c" font-weight="400" text-anchor="middle">Optimized library</text><path d="M845 115H855" fill="none" stroke="#6b9882" stroke-width="1.8" marker-end="url(#arrow-6b9882)"/><rect x="858" y="78" width="154" height="75" rx="8" fill="#fff2e7" stroke="#e2cdb8" stroke-width="1.2" class=""/><text x="935" y="106" font-size="16" fill="#30484c" font-weight="600" text-anchor="middle">Differentiate</text><text x="935" y="132" font-size="12" fill="#30484c" font-weight="400" text-anchor="middle">Manual / other AD</text><path d="M1013 115H1023" fill="none" stroke="#6b9882" stroke-width="1.8" marker-end="url(#arrow-6b9882)"/><rect x="1026" y="78" width="154" height="75" rx="8" fill="#fff2e7" stroke="#e2cdb8" stroke-width="1.2" class=""/><text x="1103" y="106" font-size="16" fill="#30484c" font-weight="600" text-anchor="middle">Update</text><text x="1103" y="132" font-size="12" fill="#30484c" font-weight="400" text-anchor="middle">Track optimizer state</text><text x="18" y="201" font-size="17" fill="#30484c" font-weight="600" text-anchor="start">TensorFlow-integrated pipeline</text><rect x="18" y="220" width="154" height="75" rx="8" fill="#edf6ea" stroke="#bfd6b8" stroke-width="1.2" class=""/><text x="95" y="248" font-size="16" fill="#30484c" font-weight="600" text-anchor="middle">Image files</text><text x="95" y="274" font-size="12" fill="#30484c" font-weight="400" text-anchor="middle">tf.data source</text><path d="M173 257H183" fill="none" stroke="#6b9882" stroke-width="1.8" marker-end="url(#arrow-6b9882)"/><rect x="186" y="220" width="154" height="75" rx="8" fill="#edf6ea" stroke="#bfd6b8" stroke-width="1.2" class=""/><text x="263" y="248" font-size="16" fill="#30484c" font-weight="600" text-anchor="middle">Decode</text><text x="263" y="274" font-size="12" fill="#30484c" font-weight="400" text-anchor="middle">tf.io decoding</text><path d="M341 257H351" fill="none" stroke="#6b9882" stroke-width="1.8" marker-end="url(#arrow-6b9882)"/><rect x="354" y="220" width="154" height="75" rx="8" fill="#edf6ea" stroke="#bfd6b8" stroke-width="1.2" class=""/><text x="431" y="248" font-size="16" fill="#30484c" font-weight="600" text-anchor="middle">Normalize</text><text x="431" y="274" font-size="12" fill="#30484c" font-weight="400" text-anchor="middle">Tensor operations</text><path d="M509 257H519" fill="none" stroke="#6b9882" stroke-width="1.8" marker-end="url(#arrow-6b9882)"/><rect x="522" y="220" width="154" height="75" rx="8" fill="#edf6ea" stroke="#bfd6b8" stroke-width="1.2" class=""/><text x="599" y="248" font-size="16" fill="#30484c" font-weight="600" text-anchor="middle">Batch</text><text x="599" y="274" font-size="12" fill="#30484c" font-weight="400" text-anchor="middle">Dataset.batch</text><path d="M677 257H687" fill="none" stroke="#6b9882" stroke-width="1.8" marker-end="url(#arrow-6b9882)"/><rect x="690" y="220" width="154" height="75" rx="8" fill="#edf6ea" stroke="#bfd6b8" stroke-width="1.2" class=""/><text x="767" y="248" font-size="16" fill="#30484c" font-weight="600" text-anchor="middle">Convolve</text><text x="767" y="274" font-size="12" fill="#30484c" font-weight="400" text-anchor="middle">Conv2D layers</text><path d="M845 257H855" fill="none" stroke="#6b9882" stroke-width="1.8" marker-end="url(#arrow-6b9882)"/><rect x="858" y="220" width="154" height="75" rx="8" fill="#edf6ea" stroke="#bfd6b8" stroke-width="1.2" class=""/><text x="935" y="248" font-size="16" fill="#30484c" font-weight="600" text-anchor="middle">Differentiate</text><text x="935" y="274" font-size="12" fill="#30484c" font-weight="400" text-anchor="middle">GradientTape</text><path d="M1013 257H1023" fill="none" stroke="#6b9882" stroke-width="1.8" marker-end="url(#arrow-6b9882)"/><rect x="1026" y="220" width="154" height="75" rx="8" fill="#edf6ea" stroke="#bfd6b8" stroke-width="1.2" class=""/><text x="1103" y="248" font-size="16" fill="#30484c" font-weight="600" text-anchor="middle">Update</text><text x="1103" y="274" font-size="12" fill="#30484c" font-weight="400" text-anchor="middle">Keras optimizer</text><text x="18" y="181" font-size="14" fill="#5c6e70" font-weight="400" text-anchor="start">Custom coordination can already use optimized NumPy/SciPy kernels or another automatic-differentiation framework.</text><rect x="18" y="324" width="282" height="92" rx="8" fill="#f4f8f5" stroke="#cbded0" stroke-width="1.2" class=""/><text x="159" y="347" font-size="13" fill="#30484c" font-weight="650" text-anchor="middle">Integrated data pipelines</text><text x="159" y="372" font-size="12" fill="#30484c" font-weight="400" text-anchor="middle">Batch, map, cache, prefetch</text><text x="159" y="397" font-size="12" fill="#5c6e70" font-weight="400" text-anchor="middle">Potential input/compute overlap</text><rect x="315" y="324" width="282" height="92" rx="8" fill="#f4f8f5" stroke="#cbded0" stroke-width="1.2" class=""/><text x="456" y="347" font-size="13" fill="#30484c" font-weight="650" text-anchor="middle">Optimized tensor computation</text><text x="456" y="372" font-size="12" fill="#30484c" font-weight="400" text-anchor="middle">Reusable convolution kernels</text><text x="456" y="397" font-size="12" fill="#5c6e70" font-weight="400" text-anchor="middle">Hardware and workload dependent</text><rect x="612" y="324" width="282" height="92" rx="8" fill="#f4f8f5" stroke="#cbded0" stroke-width="1.2" class=""/><text x="753" y="347" font-size="13" fill="#30484c" font-weight="650" text-anchor="middle">Automatic differentiation</text><text x="753" y="372" font-size="12" fill="#30484c" font-weight="400" text-anchor="middle">Compose supported derivatives</text><text x="753" y="397" font-size="12" fill="#5c6e70" font-weight="400" text-anchor="middle">Less derivative maintenance</text><rect x="909" y="324" width="282" height="92" rx="8" fill="#f4f8f5" stroke="#cbded0" stroke-width="1.2" class=""/><text x="1050" y="347" font-size="13" fill="#30484c" font-weight="650" text-anchor="middle">Less custom training infrastructure</text><text x="1050" y="372" font-size="12" fill="#30484c" font-weight="400" text-anchor="middle">Optimizer state and reusable layers</text><text x="1050" y="397" font-size="12" fill="#5c6e70" font-weight="400" text-anchor="middle">Development efficiency</text><text x="600" y="451" font-size="15" fill="#5c6e70" font-weight="400" text-anchor="middle">Capabilities, not benchmark results. Framework choice alone does not improve statistical accuracy.</text></g></svg>