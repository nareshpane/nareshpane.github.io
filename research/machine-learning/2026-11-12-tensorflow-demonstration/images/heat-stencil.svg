<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 429" role="img" aria-labelledby="title desc"><title id="title">Stable forward-time centered-space stencil with numerical update</title><desc id="desc">At one time level, three neighboring temperatures are 0.4, 0.8 and 0.6. With diffusivity time step over spatial step squared equal to 0.25, the next central value is 0.65. Nonnegative weights require r between zero and one half.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#71927b"/></marker></defs><rect width="1000" height="429" fill="#fffaf4"/><g font-family="system-ui,Segoe UI,sans-serif"><text x="30" y="35" font-size="24" fill="#233e35" text-anchor="start" font-weight="600">One explicit heat step is a weighted average of three values</text><text x="55" y="145" font-size="18" fill="#233e35" text-anchor="start" font-weight="400">Time n + 1</text><text x="55" y="280" font-size="18" fill="#233e35" text-anchor="start" font-weight="400">Time n</text><rect x="242" y="235" width="116" height="82" rx="7" fill="#e1ebd7" stroke="#c4d5c0"/><text x="300" y="264" font-size="17" fill="#233e35" text-anchor="middle" font-weight="400">i − 1</text><text x="300" y="298" font-size="23" fill="#233e35" text-anchor="middle" font-weight="600">0.4</text><path d="M300 234L500 165" stroke="#71927b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="442" y="235" width="116" height="82" rx="7" fill="#e1ebd7" stroke="#c4d5c0"/><text x="500" y="264" font-size="17" fill="#233e35" text-anchor="middle" font-weight="400">i</text><text x="500" y="298" font-size="23" fill="#233e35" text-anchor="middle" font-weight="600">0.8</text><path d="M500 234L500 165" stroke="#71927b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="642" y="235" width="116" height="82" rx="7" fill="#e1ebd7" stroke="#c4d5c0"/><text x="700" y="264" font-size="17" fill="#233e35" text-anchor="middle" font-weight="400">i + 1</text><text x="700" y="298" font-size="23" fill="#233e35" text-anchor="middle" font-weight="600">0.6</text><path d="M700 234L500 165" stroke="#71927b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="442" y="93" width="116" height="72" rx="7" fill="#c9e0cb" stroke="#c4d5c0"/><text x="500" y="122" font-size="21" fill="#233e35" text-anchor="middle" font-weight="400">uᵢⁿ⁺¹</text><text x="500" y="150" font-size="22" fill="#233e35" text-anchor="middle" font-weight="600">0.65</text><text x="356" y="191" font-size="19" fill="#233e35" text-anchor="middle" font-weight="400">r</text><text x="570" y="205" font-size="19" fill="#233e35" text-anchor="middle" font-weight="400">1 − 2r</text><text x="652" y="191" font-size="19" fill="#233e35" text-anchor="middle" font-weight="400">r</text><text x="500" y="362" font-size="21" fill="#233e35" text-anchor="middle" font-weight="400">r = 0.25:  0.25(0.4) + 0.50(0.8) + 0.25(0.6) = 0.65</text><text x="30" y="405" font-size="17" fill="#233e35" text-anchor="start" font-weight="400">For 0 ≤ r ≤ 1/2, these nonnegative weights sum to one. With r &gt; 1/2, the middle weight becomes negative.</text></g></svg>