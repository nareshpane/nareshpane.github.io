<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">Dimensioned two-level U-Net inspired network</title><desc id="desc">64 by 64 RGB inputs pass through double convolutions with 16, 32, 64 channels. Nearest-neighbor upsampling and encoder skip concatenations restore 32 and 64 pixel grids. The output is a vegetation probability for every pixel.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#69937c"/></marker><linearGradient id="heat"><stop stop-color="#688fa0"/><stop offset=".5" stop-color="#d88d55"/><stop offset="1" stop-color="#688fa0"/></linearGradient></defs><rect width="100%" height="100%" fill="#fffaf4"/><g font-family="system-ui,Segoe UI,sans-serif"><text x="30" y="35" font-size="24" fill="#233e35" text-anchor="start" font-weight="600">A compact encoder–decoder with two skip connections</text><rect x="30" y="78" width="112" height="89" rx="12" fill="#e2ecda" stroke="#c5d7c7"/><text x="86.0" y="106" font-size="16" fill="#233e35" text-anchor="middle" font-weight="600">Input</text><text x="86.0" y="137" font-size="16" fill="#233e35" text-anchor="middle" font-weight="400">64 × 64 × 3</text><rect x="190" y="78" width="146" height="89" rx="12" fill="#e2ecda" stroke="#c5d7c7"/><text x="263.0" y="106" font-size="16" fill="#233e35" text-anchor="middle" font-weight="600">2 × Conv 3×3</text><text x="263.0" y="137" font-size="16" fill="#233e35" text-anchor="middle" font-weight="400">64 × 64 × 16</text><rect x="190" y="230" width="146" height="89" rx="12" fill="#e2ecda" stroke="#c5d7c7"/><text x="263.0" y="258" font-size="16" fill="#233e35" text-anchor="middle" font-weight="600">2 × Conv 3×3</text><text x="263.0" y="289" font-size="16" fill="#233e35" text-anchor="middle" font-weight="400">32 × 32 × 32</text><rect x="420" y="365" width="160" height="87" rx="12" fill="#e2ecda" stroke="#c5d7c7"/><text x="500.0" y="393" font-size="16" fill="#233e35" text-anchor="middle" font-weight="600">2 × Conv 3×3</text><text x="500.0" y="424" font-size="16" fill="#233e35" text-anchor="middle" font-weight="400">16 × 16 × 64</text><rect x="664" y="230" width="146" height="89" rx="12" fill="#d4e5db" stroke="#c5d7c7"/><text x="737.0" y="258" font-size="16" fill="#233e35" text-anchor="middle" font-weight="600">2 × Conv 3×3</text><text x="737.0" y="289" font-size="16" fill="#233e35" text-anchor="middle" font-weight="400">32 × 32 × 32</text><rect x="664" y="78" width="146" height="89" rx="12" fill="#d4e5db" stroke="#c5d7c7"/><text x="737.0" y="106" font-size="16" fill="#233e35" text-anchor="middle" font-weight="600">2 × Conv 3×3</text><text x="737.0" y="137" font-size="16" fill="#233e35" text-anchor="middle" font-weight="400">64 × 64 × 16</text><rect x="858" y="78" width="113" height="89" rx="12" fill="#d4e5db" stroke="#c5d7c7"/><text x="914.5" y="106" font-size="16" fill="#233e35" text-anchor="middle" font-weight="600">1×1 + sigmoid</text><text x="914.5" y="137" font-size="16" fill="#233e35" text-anchor="middle" font-weight="400">64 × 64 × 1</text><path d="M142 123 L190 123" fill="none" stroke="#69937c" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M263 167 L263 230" fill="none" stroke="#69937c" stroke-width="2.4" marker-end="url(#arrow)"/><text x="281" y="204" font-size="15" fill="#233e35" text-anchor="start" font-weight="400">Pool 2×2</text><path d="M336 274 L419 389" fill="none" stroke="#69937c" stroke-width="2.4" marker-end="url(#arrow)"/><text x="346" y="331" font-size="15" fill="#233e35" text-anchor="start" font-weight="400">Pool 2×2</text><path d="M580 405 L664 288" fill="none" stroke="#69937c" stroke-width="2.4" marker-end="url(#arrow)"/><text x="626" y="355" font-size="15" fill="#233e35" text-anchor="middle" font-weight="400">Up 2×</text><text x="711" y="344" font-size="15" fill="#233e35" text-anchor="middle" font-weight="400">concat: 96 channels</text><path d="M737 230 L737 167" fill="none" stroke="#69937c" stroke-width="2.4" marker-end="url(#arrow)"/><text x="755" y="207" font-size="15" fill="#233e35" text-anchor="start" font-weight="400">Up 2×</text><path d="M336 123 L664 123" fill="none" stroke="#b28363" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="500" y="102" font-size="16" fill="#233e35" text-anchor="middle" font-weight="400">Skip → concat: 48 channels</text><path d="M336 274 L664 274" fill="none" stroke="#b28363" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="500" y="255" font-size="16" fill="#233e35" text-anchor="middle" font-weight="400">Skip → concat: 96 channels</text><path d="M810 123 L858 123" fill="none" stroke="#69937c" stroke-width="2.4" marker-end="url(#arrow)"/><text x="501" y="490" font-size="16" fill="#233e35" text-anchor="middle" font-weight="400">All convolutions use same padding. Double-convolution blocks use ReLU; max pooling halves spatial size.</text></g></svg>