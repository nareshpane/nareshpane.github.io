<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-labelledby="mag-title mag-desc" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#26323B">
<title id="mag-title">Equal account features can lead to different neighborhood representations</title>
<desc id="mag-desc">A scalar-feature directed graph has xA=2, xB=1, xC=4, xD=1. Two edges from A and one from C enter B; one edge from B enters D. Incoming repeated-edge means are mB=8/3 and mD=1. A synchronous fixed-weight update h=tanh(0.5x+0.3m−0.2) gives hB=0.800499 and hD=0.537050. This analytical illustration is not a trained model or a wrongdoing judgment.</desc>
<defs><marker id="mag-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#7B9DB6"/></marker></defs>
<text x="24" y="34" font-family="Georgia,serif" font-size="26">Messages reveal what self-features alone cannot distinguish</text>
<text x="24" y="63" font-size="17" fill="#576774">Analytical scalar-feature graph · fixed weights · no fitted transaction scores</text>
<rect x="24" y="88" width="432" height="365" rx="9" fill="#EDF6FC" stroke="#B7D3E7"/>
<path d="M137 151Q232 110 305 214" fill="none" stroke="#8EADC3" stroke-width="2" marker-end="url(#mag-arrow)"/>
<path d="M133 184Q222 235 286 241" fill="none" stroke="#8EADC3" stroke-width="2" marker-end="url(#mag-arrow)"/>
<path d="M137 328L290 266" fill="none" stroke="#8EADC3" stroke-width="2" marker-end="url(#mag-arrow)"/>
<path d="M320 280V350" fill="none" stroke="#8EADC3" stroke-width="2" marker-end="url(#mag-arrow)"/>
<rect x="173" y="157" width="101" height="29" rx="5" fill="#FFFFFF"/>
<text x="224" y="178" text-anchor="middle" font-size="17">2 × xA = 4</text>
<rect x="168" y="280" width="80" height="29" rx="5" fill="#FFFFFF"/>
<text x="208" y="301" text-anchor="middle" font-size="17">xC = 4</text>
<text x="341" y="321" font-size="17">xB = 1</text>
<circle cx="106" cy="164" r="34" fill="#FFFFFF" stroke="#8EADC3" stroke-width="1.5"/>
<text x="106" y="160" text-anchor="middle" font-weight="600">A</text><text x="106" y="183" text-anchor="middle">x=2</text>
<circle cx="106" cy="341" r="34" fill="#FFFFFF" stroke="#8EADC3" stroke-width="1.5"/>
<text x="106" y="337" text-anchor="middle" font-weight="600">C</text><text x="106" y="360" text-anchor="middle">x=4</text>
<circle cx="320" cy="245" r="35" fill="#FFF3EB" stroke="#B57A60" stroke-width="1.7"/>
<text x="320" y="241" text-anchor="middle" font-weight="600">B</text><text x="320" y="264" text-anchor="middle">x=1</text>
<circle cx="320" cy="389" r="35" fill="#FFF3EB" stroke="#B57A60" stroke-width="1.7"/>
<text x="320" y="385" text-anchor="middle" font-weight="600">D</text><text x="320" y="408" text-anchor="middle">x=1</text>
<text x="46" y="432" font-size="17" fill="#576774">Edges are directed; repeated transfers count.</text>
<rect x="488" y="88" width="448" height="161" rx="9" fill="#F1F8EE" stroke="#BCD7B6"/>
<text x="510" y="118" font-weight="600">1 · Aggregate original incoming features</text>
<text x="510" y="154" font-family="Cambria,Georgia,serif" font-size="23">mB = (2 + 2 + 4) / 3 = 8/3</text>
<text x="510" y="188" font-family="Cambria,Georgia,serif" font-size="23">mD = 1 / 1 = 1</text>
<text x="510" y="225" font-size="17">B and D share x=1, but their messages differ.</text>
<rect x="488" y="270" width="448" height="183" rx="9" fill="#F6F2FA" stroke="#D8CAE7"/>
<text x="510" y="299" font-weight="600">2 · Apply the same shared transformation</text>
<text x="510" y="333" font-family="Cambria,Georgia,serif" font-size="21">zB = 0.5(1) + 0.3(8/3) − 0.2 = 1.1</text>
<text x="510" y="361" font-family="Cambria,Georgia,serif" font-size="21">hB = tanh(1.1) = 0.800499</text>
<text x="510" y="400" font-family="Cambria,Georgia,serif" font-size="21">zD = 0.5(1) + 0.3(1) − 0.2 = 0.6</text>
<text x="510" y="429" font-family="Cambria,Georgia,serif" font-size="21">hD = tanh(0.6) = 0.537050</text>
<text x="24" y="489" font-size="18">Synchronous update: the message B→D contains original xB=1, before either embedding is updated.</text>
<text x="24" y="517" font-size="17" fill="#576774">The fitted experiment expands this mechanism to five input features, twelve embedding coordinates, and an edge head.</text>
</svg>
