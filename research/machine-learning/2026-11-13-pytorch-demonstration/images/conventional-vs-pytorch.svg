<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 418" role="img" aria-labelledby="title desc"><title id="title">Two equivalent-objective workflows expose derivative responsibilities</title><desc id="desc">Two aligned lanes compare conventional numerical expressions, analytical or numerical derivatives, updates, and validation with tensor operations, autograd, optimizers, and validation. Both require the researcher to specify the scientific model and checks; no performance result is asserted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8296A5"/></marker></defs><rect width="1200" height="418" fill="#FFFFFF"/><g font-family="system-ui,Segoe UI,sans-serif"><text x="600" y="34" font-size="23" fill="#26323B" text-anchor="middle" font-weight="500">The same objective; a different way to maintain derivatives</text><text x="20" y="83" font-size="18" fill="#26323B" text-anchor="start" font-weight="600">Conventional implementation</text><rect x="20" y="100" width="270" height="81" rx="7" fill="#FFF2E8" stroke="#C8D3DC" stroke-width="1.4"/><text x="155" y="131" font-size="20" fill="#26323B" text-anchor="middle" font-weight="500">Numerical expressions</text><text x="155" y="160" font-size="15" fill="#5C6F7C" text-anchor="middle" font-weight="400">NumPy / SciPy primitives</text><line x1="293" y1="140" x2="310" y2="140" stroke="#477DA5" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="315" y="100" width="270" height="81" rx="7" fill="#FFF2E8" stroke="#C8D3DC" stroke-width="1.4"/><text x="450" y="131" font-size="20" fill="#26323B" text-anchor="middle" font-weight="500">Analytical derivative</text><text x="450" y="153" font-size="15" fill="#5C6F7C" text-anchor="middle" font-weight="400">or numerical derivatives</text><text x="450" y="171" font-size="15" fill="#5C6F7C" text-anchor="middle" font-weight="400">inside a classical optimizer</text><line x1="588" y1="140" x2="605" y2="140" stroke="#477DA5" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="610" y="100" width="270" height="81" rx="7" fill="#FFF2E8" stroke="#C8D3DC" stroke-width="1.4"/><text x="745" y="131" font-size="20" fill="#26323B" text-anchor="middle" font-weight="500">Updates</text><text x="745" y="160" font-size="15" fill="#5C6F7C" text-anchor="middle" font-weight="400">chosen optimization method</text><line x1="883" y1="140" x2="900" y2="140" stroke="#477DA5" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="905" y="100" width="270" height="81" rx="7" fill="#FFF2E8" stroke="#C8D3DC" stroke-width="1.4"/><text x="1040" y="131" font-size="20" fill="#26323B" text-anchor="middle" font-weight="500">Validation</text><text x="1040" y="160" font-size="15" fill="#5C6F7C" text-anchor="middle" font-weight="400">independent reference + holdout</text><text x="20" y="228" font-size="18" fill="#26323B" text-anchor="start" font-weight="600">PyTorch implementation</text><rect x="20" y="245" width="270" height="81" rx="7" fill="#EDF5FC" stroke="#C8D3DC" stroke-width="1.4"/><text x="155" y="276" font-size="20" fill="#26323B" text-anchor="middle" font-weight="500">Tensor operations</text><text x="155" y="305" font-size="15" fill="#5C6F7C" text-anchor="middle" font-weight="400">torch.Tensor primitives</text><line x1="293" y1="285" x2="310" y2="285" stroke="#477DA5" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="315" y="245" width="270" height="81" rx="7" fill="#EDF5FC" stroke="#C8D3DC" stroke-width="1.4"/><text x="450" y="276" font-size="20" fill="#26323B" text-anchor="middle" font-weight="500">Autograd</text><text x="450" y="305" font-size="15" fill="#5C6F7C" text-anchor="middle" font-weight="400">registered local derivative rules</text><line x1="588" y1="285" x2="605" y2="285" stroke="#477DA5" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="610" y="245" width="270" height="81" rx="7" fill="#EDF5FC" stroke="#C8D3DC" stroke-width="1.4"/><text x="745" y="276" font-size="20" fill="#26323B" text-anchor="middle" font-weight="500">Optimizer</text><text x="745" y="305" font-size="15" fill="#5C6F7C" text-anchor="middle" font-weight="400">gradient + parameter state</text><line x1="883" y1="285" x2="900" y2="285" stroke="#477DA5" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="905" y="245" width="270" height="81" rx="7" fill="#EDF5FC" stroke="#C8D3DC" stroke-width="1.4"/><text x="1040" y="276" font-size="20" fill="#26323B" text-anchor="middle" font-weight="500">Validation</text><text x="1040" y="305" font-size="15" fill="#5C6F7C" text-anchor="middle" font-weight="400">independent reference + holdout</text><text x="600" y="365" font-size="17" fill="#26323B" text-anchor="middle" font-weight="400">The researcher still chooses the model, objective, data, assumptions, and checks.</text><text x="600" y="393" font-size="16" fill="#5C6F7C" text-anchor="middle" font-weight="400">A library capability is not a measured speedup or a guarantee of scientific validity.</text></g></svg>
