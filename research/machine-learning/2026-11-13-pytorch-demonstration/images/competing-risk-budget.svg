<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="crb-title crb-desc" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#26323B">
<title id="crb-title">Conditional hazards partition the remaining probability mass</title>
<desc id="crb-desc">Two bins have conditional probabilities (0.8,0.15,0.05) and (0.75,0.10,0.15). Survival at two bins is 0.60, cause-one incidence is 0.23, and cause-two incidence is 0.17. A cause-one event in bin two has likelihood 0.08, while end-of-bin-two censoring contributes survival likelihood 0.60. Events tied with an end-of-bin censor are observed.</desc>
<text x="24" y="34" font-family="Georgia,serif" font-size="26">A probability budget across two competing-risk bins</text>
<text x="24" y="63" font-size="17" fill="#576774">Analytical construction · each conditional row applies only to subjects still event-free</text>
<rect x="24" y="83" width="440" height="137" rx="8" fill="#EDF6FC" stroke="#B7D3E7"/>
<text x="44" y="111" font-weight="600">Bin 1 · event-free probability entering = 1</text>
<rect x="44" y="130" width="304" height="25" fill="#A9C9DF"/>
<rect x="348" y="130" width="57" height="25" fill="#D4A48F"/>
<rect x="405" y="130" width="19" height="25" fill="#B8A5CC"/>
<text x="44" y="183" font-family="Cambria,Georgia,serif" font-size="21">p₀=0.80</text>
<text x="184" y="183" font-family="Cambria,Georgia,serif" font-size="21">p₁=0.15</text>
<text x="324" y="183" font-family="Cambria,Georgia,serif" font-size="21">p₂=0.05</text>
<text x="44" y="206" font-size="16" fill="#576774">No event</text><text x="184" y="206" font-size="16" fill="#576774">Cause 1</text><text x="324" y="206" font-size="16" fill="#576774">Cause 2</text>
<rect x="496" y="83" width="440" height="137" rx="8" fill="#F6F2FA" stroke="#D8CAE7"/>
<text x="516" y="111" font-weight="600">Bin 2 · event-free probability entering = 0.80</text>
<rect x="516" y="130" width="285" height="25" fill="#A9C9DF"/>
<rect x="801" y="130" width="38" height="25" fill="#D4A48F"/>
<rect x="839" y="130" width="57" height="25" fill="#B8A5CC"/>
<text x="516" y="183" font-family="Cambria,Georgia,serif" font-size="21">p₀=0.75</text>
<text x="656" y="183" font-family="Cambria,Georgia,serif" font-size="21">p₁=0.10</text>
<text x="796" y="183" font-family="Cambria,Georgia,serif" font-size="21">p₂=0.15</text>
<text x="516" y="206" font-size="16" fill="#576774">No event</text><text x="656" y="206" font-size="16" fill="#576774">Cause 1</text><text x="796" y="206" font-size="16" fill="#576774">Cause 2</text>
<text x="24" y="253" font-weight="600">Cumulative probabilities at the end of bin 2</text>
<rect x="24" y="270" width="288" height="79" rx="7" fill="#EDF6FC" stroke="#B7D3E7"/>
<text x="44" y="298" font-family="Cambria,Georgia,serif" font-size="22">S₂ = 0.80 × 0.75 = 0.60</text>
<text x="44" y="328" font-size="17">Survive both bins without either event.</text>
<rect x="336" y="270" width="288" height="79" rx="7" fill="#FFF3EB" stroke="#DDBAA8"/>
<text x="356" y="298" font-family="Cambria,Georgia,serif" font-size="22">F₁,₂ = 0.15 + 0.80 × 0.10</text>
<text x="356" y="328" font-size="19">= 0.23</text>
<rect x="648" y="270" width="288" height="79" rx="7" fill="#F6F2FA" stroke="#D8CAE7"/>
<text x="668" y="298" font-family="Cambria,Georgia,serif" font-size="22">F₂,₂ = 0.05 + 0.80 × 0.15</text>
<text x="668" y="328" font-size="19">= 0.17</text>
<rect x="24" y="368" width="547.2" height="31" fill="#BCD5E7"/>
<rect x="571.2" y="368" width="209.76" height="31" fill="#E4C3B3"/>
<rect x="780.96" y="368" width="155.04" height="31" fill="#D0C1DF"/>
<text x="297" y="390" text-anchor="middle" font-size="18">S₂ = 0.60</text>
<text x="676" y="390" text-anchor="middle" font-size="18">F₁,₂ = 0.23</text>
<text x="858" y="390" text-anchor="middle" font-size="18">F₂,₂ = 0.17</text>
<rect x="24" y="421" width="440" height="92" rx="8" fill="#FFF3EB" stroke="#DDBAA8"/>
<text x="44" y="449" font-weight="600">Observed cause 1 in bin 2</text>
<text x="44" y="478" font-family="Cambria,Georgia,serif" font-size="22">Likelihood = 0.80 × 0.10 = 0.08</text>
<text x="44" y="501" font-size="16">No event first; the selected event next.</text>
<rect x="496" y="421" width="440" height="92" rx="8" fill="#F1F8EE" stroke="#BCD7B6"/>
<text x="516" y="449" font-weight="600">Censored at the end of bin 2</text>
<text x="516" y="478" font-family="Cambria,Georgia,serif" font-size="22">Likelihood = 0.80 × 0.75 = 0.60</text>
<text x="516" y="501" font-size="16">Event-free through every observed bin.</text>
<text x="24" y="543" font-size="17" fill="#576774">S₂ + F₁,₂ + F₂,₂ = 1.00.  An event in the same bin as end-of-bin censoring is observed.</text>
</svg>
