<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">A linked map of the main PyTorch namespaces</title><desc id="desc">Seven keyboard-accessible links connect torch to tensor storage, autograd, neural modules, optimizers, data loading, function transformations, and compilation. Each node opens the appropriate official PyTorch documentation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8296A5"/></marker></defs><rect width="1000" height="500" fill="#FFFFFF"/><g font-family="system-ui,Segoe UI,sans-serif"><text x="500" y="35" font-size="23" fill="#26323B" text-anchor="middle" font-weight="500">Explore a public interface, then inspect one small computation</text><path d="M500 204C500 174 130 181 130 158" fill="none" stroke="#B5C7D3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><a href="https://docs.pytorch.org/docs/stable/tensors.html" target="_blank" rel="noopener noreferrer" aria-label="Official torch.Tensor documentation"><rect x="20" y="72" width="220" height="85" rx="8" fill="#EDF5FC" stroke="#B9CDD9" stroke-width="1.4"/><text x="130" y="106" font-size="20" fill="#26323B" text-anchor="middle" font-weight="500">torch.Tensor</text><text x="130" y="134" font-size="15" fill="#596F7D" text-anchor="middle" font-weight="400">shape · dtype · device</text></a><path d="M500 204C500 174 375 181 375 158" fill="none" stroke="#B5C7D3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><a href="https://docs.pytorch.org/docs/stable/autograd.html" target="_blank" rel="noopener noreferrer" aria-label="Official torch.autograd documentation"><rect x="265" y="72" width="220" height="85" rx="8" fill="#EDF5FC" stroke="#B9CDD9" stroke-width="1.4"/><text x="375" y="106" font-size="20" fill="#26323B" text-anchor="middle" font-weight="500">torch.autograd</text><text x="375" y="134" font-size="15" fill="#596F7D" text-anchor="middle" font-weight="400">reverse differentiation</text></a><path d="M500 204C500 174 620 181 620 158" fill="none" stroke="#B5C7D3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><a href="https://docs.pytorch.org/docs/stable/nn.html" target="_blank" rel="noopener noreferrer" aria-label="Official torch.nn documentation"><rect x="510" y="72" width="220" height="85" rx="8" fill="#EDF5FC" stroke="#B9CDD9" stroke-width="1.4"/><text x="620" y="106" font-size="20" fill="#26323B" text-anchor="middle" font-weight="500">torch.nn</text><text x="620" y="134" font-size="15" fill="#596F7D" text-anchor="middle" font-weight="400">reusable parameterized layers</text></a><path d="M500 204C500 174 865 181 865 158" fill="none" stroke="#B5C7D3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><a href="https://docs.pytorch.org/docs/stable/optim.html" target="_blank" rel="noopener noreferrer" aria-label="Official torch.optim documentation"><rect x="755" y="72" width="220" height="85" rx="8" fill="#EDF5FC" stroke="#B9CDD9" stroke-width="1.4"/><text x="865" y="106" font-size="20" fill="#26323B" text-anchor="middle" font-weight="500">torch.optim</text><text x="865" y="134" font-size="15" fill="#596F7D" text-anchor="middle" font-weight="400">parameter updates + state</text></a><path d="M500 284C500 318 185 314 185 347" fill="none" stroke="#B5C7D3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><a href="https://docs.pytorch.org/docs/stable/data.html" target="_blank" rel="noopener noreferrer" aria-label="Official torch.utils.data documentation"><rect x="75" y="350" width="220" height="85" rx="8" fill="#FFF2E8" stroke="#B9CDD9" stroke-width="1.4"/><text x="185" y="384" font-size="20" fill="#26323B" text-anchor="middle" font-weight="500">torch.utils.data</text><text x="185" y="412" font-size="15" fill="#596F7D" text-anchor="middle" font-weight="400">datasets + batching</text></a><path d="M500 284C500 318 500 314 500 347" fill="none" stroke="#B5C7D3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><a href="https://docs.pytorch.org/docs/stable/func.api.html" target="_blank" rel="noopener noreferrer" aria-label="Official torch.func documentation"><rect x="390" y="350" width="220" height="85" rx="8" fill="#FFF2E8" stroke="#B9CDD9" stroke-width="1.4"/><text x="500" y="384" font-size="20" fill="#26323B" text-anchor="middle" font-weight="500">torch.func</text><text x="500" y="412" font-size="15" fill="#596F7D" text-anchor="middle" font-weight="400">grad · vmap · Jacobians</text></a><path d="M500 284C500 318 815 314 815 347" fill="none" stroke="#B5C7D3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><a href="https://docs.pytorch.org/docs/stable/generated/torch.compile.html" target="_blank" rel="noopener noreferrer" aria-label="Official torch.compile documentation"><rect x="705" y="350" width="220" height="85" rx="8" fill="#FFF2E8" stroke="#B9CDD9" stroke-width="1.4"/><text x="815" y="384" font-size="20" fill="#26323B" text-anchor="middle" font-weight="500">torch.compile</text><text x="815" y="412" font-size="15" fill="#596F7D" text-anchor="middle" font-weight="400">optional graph compilation</text></a><a href="https://docs.pytorch.org/docs/stable/index.html" target="_blank" rel="noopener noreferrer" aria-label="Official PyTorch documentation"><rect x="409" y="205" width="182" height="78" rx="10" fill="#F4EFFA" stroke="#BEAECF" stroke-width="1.4"/><text x="500" y="240" font-size="28" fill="#26323B" text-anchor="middle" font-weight="600">torch</text><text x="500" y="264" font-size="16" fill="#596F7D" text-anchor="middle" font-weight="400">Python namespace</text></a><text x="500" y="476" font-size="16" fill="#596F7D" text-anchor="middle" font-weight="400">Select a node to open its official documentation. Private names are not stable contracts.</text></g></svg>
