<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}iframe{width:100%;height:100vh;border:0}</style></head><body><iframe id="page" src="../../details-of-machine-learning-models.html"></iframe><pre id="qa" hidden></pre><script>
const check=(a,s)=>{if(!a)throw Error(s)};
document.getElementById('page').addEventListener('load',async()=>{
try {
 const frame=document.getElementById('page'),w=frame.contentWindow,d=w.document;
 const requested=Number(new URLSearchParams(location.search).get('width'));
 frame.style.width=requested+'px';
 void d.documentElement.offsetWidth;
 await w.MathJax.startup.promise;
 const $=id=>d.getElementById(id);const dispatch=(el,type)=>el.dispatchEvent(new w.Event(type,{bubbles:true}));
 const visible=body=>[...body.rows].filter(r=>!r.hidden).length;
 const models=[...d.querySelectorAll('details.model')];
 check(models.length===6&&models.every(x=>!x.open),'six initially collapsed models');
 $('expand-all').click();check(models.every(x=>x.open),'Expand All');
 check(d.documentElement.scrollWidth<=d.documentElement.clientWidth+1,'expanded algorithms have no page-wide overflow');
 $('collapse-all').click();check(models.every(x=>!x.open),'Collapse All');
 models[0].open=true;models[1].open=true;check(models.filter(x=>x.open).length===2,'independent expansion');$('collapse-all').click();
 const rows=$('dataset-body');check(rows.rows.length===336&&visible(rows)===336,'336 static accessible rows');
 $('dataset-search').value='Canada 1001';dispatch($('dataset-search'),'input');check(visible(rows)===48,'country and HS4 search');
 $('filter-year').value='2024';dispatch($('filter-year'),'change');check(visible(rows)===12,'search plus year');
 $('filter-exporter').value='Canada';dispatch($('filter-exporter'),'change');check(visible(rows)===6,'exporter filter');
 $('filter-destination').value='China';dispatch($('filter-destination'),'change');check(visible(rows)===1,'destination filter');
 $('filter-sector').value='8703';dispatch($('filter-sector'),'change');check(visible(rows)===0,'conflicting HS search/filter gives zero');
 $('clear-filters').click();check(visible(rows)===336&&$('dataset-search').value==='','Clear Filters restores 336');
 for(let k=1;k<=6;k++){
   const control=d.querySelector('[data-body="pred-body-'+k+'"]');const sel=control.querySelector('select'),input=control.querySelector('input'),body=$('pred-body-'+k);
   check(visible(body)===168,'168 evaluation predictions');sel.value='2024';dispatch(sel,'change');check(visible(body)===84,'84 validation predictions');
   input.value='Canada 1001';dispatch(input,'input');check(visible(body)===12,'prediction country/sector search');
   control.querySelector('button').click();check(visible(body)===168,'prediction clear');
   sel.value='2025';dispatch(sel,'change');check(visible(body)===84,'84 forecast predictions');
   check([...body.rows].filter(r=>!r.hidden).every(r=>r.cells[5].textContent==='N/A'&&r.cells[7].textContent==='N/A'),'2025 observed outcomes/errors missing');
   control.querySelector('button').click();
 }
 const scroll=d.querySelector('.table-scroll.dataset');check(scroll.scrollHeight>scroll.clientHeight&&scroll.scrollWidth>scroll.clientWidth,'vertical and horizontal dataset scrolling');
 scroll.scrollTop=160;scroll.scrollLeft=120;check(scroll.scrollTop>0&&scroll.scrollLeft>0,'both scrolling offsets');scroll.scrollTop=0;scroll.scrollLeft=0;
 check(w.getComputedStyle(rows.rows[0].cells[0]).position==='sticky','sticky ID');check(w.getComputedStyle(d.querySelector('.dataset th')).position==='sticky','sticky header');
 const images=[...d.images];images.forEach(i=>i.loading='eager');await Promise.all(images.map(i=>i.decode()));check(images.every(i=>i.naturalWidth>0),'all images decoded');
 const response=await fetch('../toy_trade_dataset.csv');const csv=await response.text();check(response.ok&&csv.includes('observation_id'),'CSV download resolves');
 const width=d.documentElement.clientWidth;check(d.documentElement.scrollWidth<=width+1,'no page-wide mobile overflow');
 check(d.querySelectorAll('mjx-container').length>100,'math rendering');check(d.querySelectorAll('mjx-merror').length===0,'no equation errors');
 check(w.chapterUI.errors.length===0,'no captured JavaScript errors');
 check(w.innerWidth===requested,'exact responsive frame viewport');

 $('expand-all').click();
 const headers=[...d.querySelectorAll('.dataset thead th')].map(x=>x.textContent);
 check(headers.length===29&&!headers.includes('Source & vintage'),'only requested source column removed');
 check([...$('dataset-body').rows].every(x=>x.cells.length===29),'all 336 rows align with headers');
 check(csv.split('\n')[0].includes('data_source'),'CSV source field retained');
 check([...d.querySelectorAll('#follow td')].some(x=>x.textContent==='data_source'),'source field retained in full-record table');
 const centered=[];
 function measureTables(){
  for(const el of d.querySelectorAll('.table-scroll')){
   const box=el.getBoundingClientRect(),parent=el.parentElement.getBoundingClientRect();
   check(Math.abs((box.left+box.right-parent.left-parent.right)/2)<1,'centered wrapper: '+el.querySelector('caption')?.textContent);
   centered.push(el.querySelector('caption')?.textContent||'Table');
  }
 }
 measureTables();
 $('dataset-search').value='Canada 1001';dispatch($('dataset-search'),'input');measureTables();$('clear-filters').click();
 for(const control of d.querySelectorAll('.prediction-controls')){control.querySelector('input').value='Canada 1001';dispatch(control.querySelector('input'),'input');measureTables();control.querySelector('button').click();}
 check([...d.querySelectorAll('td.numeric')].every(x=>w.getComputedStyle(x).textAlign==='right'),'numeric alignment preserved');
 const box=d.querySelector('.page-provenance');check(d.querySelectorAll('.page-provenance').length===1,'one provenance box');
 check(box.textContent.includes('October 8, 2026')&&box.textContent.includes('Codex on Windows'),'verified creation date and harness');
 check(box.querySelectorAll('.provenance-item').length===4,'four provenance fields');
 check(box.querySelectorAll('.provenance-icon svg').length===1,'reference SVG model icon');
 const title=d.querySelector('.hero>div'),a=box.getBoundingClientRect(),b=title.getBoundingClientRect();
 check(a.right<=width&&a.left>=0,'provenance does not overflow');
 check(requested>800?a.left>=b.right:a.top>=b.bottom,'provenance does not overlap title');
 // Compare the reference component's computed styles without starting its app.
 const reference=await (await fetch('../../canada-and-provinces-trade-by-hs.html')).text();
 const parsed=new w.DOMParser().parseFromString(reference,'text/html');
 const refbox=parsed.querySelector('.page-provenance');
 const refFrame=d.createElement('iframe');refFrame.style.cssText='position:absolute;left:-10000px;width:500px;height:300px';
 const loaded=new Promise(resolve=>refFrame.onload=resolve);
 refFrame.srcdoc='<base href="'+new URL('../../canada-and-provinces-trade-by-hs.html',location.href)+'"><link rel="stylesheet" href="2b-canada-provinces-trade-by-hs/css/style.css"><link rel="stylesheet" href="2b-canada-provinces-trade-by-hs/css/explorer.css">'+refbox.outerHTML;
 d.body.append(refFrame);await loaded;
 const referenceStyle=refFrame.contentWindow.getComputedStyle(refFrame.contentDocument.querySelector('.page-provenance')),ours=w.getComputedStyle(box);
 const properties=['backgroundColor','borderTopWidth','borderTopColor','borderRightWidth','borderRightColor','borderRadius','paddingTop','paddingRight','fontSize','lineHeight','fontFamily','color','boxShadow'];
 const matched={};for(const key of properties){check(ours[key]===referenceStyle[key],'reference provenance '+key);matched[key]=ours[key];}
 check([...box.querySelectorAll('.provenance-icon')].map(x=>x.innerHTML).join('|')===[...refbox.querySelectorAll('.provenance-icon')].map(x=>x.innerHTML).join('|'),'exact reference icons');
 refFrame.remove();
 const displayChanges={datasetColumns:headers.length,centeredTables:new Set(centered).size,expandedModels:models.map(x=>x.id),provenance:box.textContent,referenceStyles:matched};
  const report={displayChanges,status:'PASS',viewport:w.innerWidth,documentWidth:width,models:6,datasetRows:336,predictionRowsEach:168,mathExpressions:d.querySelectorAll('mjx-container').length,mathErrors:0,images:images.length,consoleErrors:w.chapterUI.errors,checks:['combined search and all filters','clear restores all rows','six independent collapses and all-controls','prediction table year/search/clear','2025 observed N/A','sticky headers/ID','both table scroll axes','all images','local MathJax','CSV response','responsive no overflow']};
 // Component-focused views preserve real page DOM/CSS, with no browser scrolling dependency.
 const view=new URLSearchParams(location.search).get('view');
 if(view==='algorithm'){models[0].open=true;const m=models[0];const keep=[...m.querySelector('.model-body').children].slice(0,5);m.querySelector('.model-body').replaceChildren(...keep);$('main').replaceChildren(m);}
 if(view==='worked'){models[5].open=true;const m=models[5],body=m.querySelector('.model-body');const h=[...body.querySelectorAll('h3')].find(x=>x.textContent.startsWith('E /'));const keep=[];let node=h;while(node&&!node.textContent.startsWith('F /')){keep.push(node);node=node.nextElementSibling;}body.replaceChildren(...keep);$('main').replaceChildren(m);}
 if(view==='dataset'){$('main').replaceChildren($('dataset'));}
if(view==='features'){$('main').replaceChildren($('inputs'));}
    if(view==='elastic'){const m=models[1],body=m.querySelector('.model-body'),h=[...body.querySelectorAll('h3')].find(x=>x.textContent.startsWith('E /')),keep=[];let node=h;while(node&&!node.textContent.startsWith('F /')){keep.push(node);node=node.nextElementSibling;}body.replaceChildren(...keep);$('main').replaceChildren(m);}
     document.getElementById('qa').textContent=JSON.stringify(report);
}catch(e){document.getElementById('qa').textContent=JSON.stringify({status:'FAIL',message:e.message,stack:e.stack});}
});</script></body></html>
