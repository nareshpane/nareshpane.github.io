<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 128" role="img" aria-labelledby="title desc">
<title id="title">Commit and durable redo</title><desc id="desc">A commit request leads to durable redo and acknowledgement under normal synchronous commit semantics; it does not imply that every changed data block has already reached a data file.</desc>
<g fill="none" stroke="#485d60" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, sans-serif"><path d="M29 35C42 11 93 9 120 22S162 53 155 82 115 115 79 111 22 106 18 80 19 52 29 35Z" fill="#d9eddb" stroke="none" /><path d="M17 112H163" stroke="#c5ceca" fill="none" /><rect x="19" y="31" width="50" height="68" rx="3" fill="#fffaf2" stroke="#485d60"/><text x="25" y="44" font-size="8" fill="#485d60" stroke="none" >COMMIT</text><path d="M25 54H55.0" stroke="#9eada8" fill="none" /><path d="M25 61H45.5" stroke="#9eada8" fill="none" /><path d="M25 68H51.5" stroke="#9eada8" fill="none" /><path d="M73 64H89" stroke="#72a88b" fill="none" /><path d="M85 61l4 3-4 3" fill="none" stroke="#72a88b" /><rect x="95" y="33" width="64" height="66" rx="4" fill="#f6e4d5" stroke="#485d60"/><text x="127" y="47" font-size="8" fill="#485d60" stroke="none" text-anchor="middle">REDO LOG</text><path d="M104 58h46m-46 9h46m-46 9h31" fill="none" stroke="#9eada8" /><path d="M126 87l4 4 9-11" fill="none" stroke="#72a88b" stroke-width="2.5"/><text x="90" y="114" font-size="6.9" fill="#485d60" stroke="none" text-anchor="middle">acknowledge after redo is durable</text></g></svg>