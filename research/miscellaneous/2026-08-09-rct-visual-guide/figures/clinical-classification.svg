-weight="600">B · Culture-negative clinical sepsis</text><text x="405" y="189" font-size="15" text-anchor="start" fill="#344750" font-weight="400">36 placebo / 19 synbiotic</text><text x="941" y="182" font-size="27" text-anchor="end" fill="#4d6a55" font-weight="600">55</text><rect x="385" y="215" width="585" height="64" rx="12" fill="#f6f2fb" stroke="#d3dcd5"/><text x="405" y="240" font-size="18" text-anchor="start" fill="#344750" font-weight="600">C · pSBI–LRTI</text><text x="405" y="264" font-size="15" text-anchor="start" fill="#344750" font-weight="400">139 placebo / 92 synbiotic</text><text x="941" y="257" font-size="27" text-anchor="end" fill="#4d6a55" font-weight="600">231</text><text x="385" y="316" font-size="14" text-anchor="start" fill="#344750" font-weight="400">The additional 94 culture-negative evaluations have no dedicated release flag.</text></g></svg>