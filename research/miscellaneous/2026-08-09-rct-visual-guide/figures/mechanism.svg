<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="title desc"><title id="title">Intervention delivery and hypothesized biological mediation</title><desc id="desc">The assigned synbiotic is administered. Microbiota changes and host-defense pathways to infection risk are hypotheses, shown by dashed arrows.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#617b57"/></marker></defs><rect width="900" height="260" fill="#fffdf9"/><g font-family="Georgia,serif" font-size="20" fill="#303e35"><rect x="20" y="60" width="200" height="120" rx="12" fill="#eaf3e1" stroke="#afc69d"/><text x="120" y="104" text-anchor="middle">Assigned synbiotic</text><text x="120" y="137" text-anchor="middle" font-size="17">Organism + substrate</text><rect x="300" y="60" width="220" height="120" rx="12" fill="#eef5f7" stroke="#b8d1da"/><text x="410" y="104" text-anchor="middle">Administered orally</text><text x="410" y="137" text-anchor="middle" font-size="17">Seven-day strategy</text><rect x="620" y="25" width="255" height="78" rx="12" fill="#f8f0e5" stroke="#d6bf9d"/><text x="748" y="56" text-anchor="middle">Microbiota / host defenses</text><text x="748" y="82" text-anchor="middle" font-size="16">Proposed mediators</text><rect x="620" y="150" width="255" height="78" rx="12" fill="#f8f0e5" stroke="#d6bf9d"/><text x="748" y="182" text-anchor="middle">Clinical infection outcomes</text><text x="748" y="208" text-anchor="middle" font-size="16">Observed, not mechanism proof</text><path d="M225 120H290" fill="none" stroke="#617b57" stroke-width="2" marker-end="url(#arrow)"/><path d="M525 105L610 65M748 108V140" fill="none" stroke="#617b57" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="32" y="230" font-size="16">Solid: delivery · Dashed: hypothesized biological links</text></g></svg>
