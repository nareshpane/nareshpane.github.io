<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" role="img" aria-labelledby="title desc"><title id="title">Published recruitment, allocation and disposition</title><desc id="desc">7089 registered pregnant women, 2506 exclusions, 27 consent refusals, 4556 randomized infants. Each arm has 2278 assigned. Placebo: 2185 completed, 13 withdrawn, 76 lost, 4 deaths. Synbiotic: 2141 completed, 19 withdrawn, 112 lost, 6 deaths. All assigned records enter the binary reproduction.</desc><rect width="900" height="590" fill="#fffdf9"/><g font-family="Georgia,serif" fill="#303e35" text-anchor="middle"><g stroke="#c8d4bc" fill="#f0f6e9"><rect x="210" y="18" width="480" height="62" rx="10"/><rect x="240" y="212" width="420" height="64" rx="10"/><rect x="40" y="320" width="370" height="62" rx="10" fill="#f7eee5" stroke="#d8bfa8"/><rect x="490" y="320" width="370" height="62" rx="10" fill="#eaf3f7" stroke="#accad7"/></g><g stroke="#c8c5bb" fill="#faf7f0"><rect x="110" y="111" width="680" height="65" rx="10"/><rect x="40" y="415" width="370" height="100" rx="10"/><rect x="490" y="415" width="370" height="100" rx="10"/><rect x="140" y="546" width="620" height="34" rx="8"/></g><g stroke="#87947c" fill="none" stroke-width="2"><path d="M450 81V110M450 177V211M450 277V298H225V319M450 298H675V319M225 383V414M675 383V414M225 516V533H450V545M675 516V533H450"/></g><g font-size="22"><text x="450" y="44">7,089 pregnant women registered</text><text x="450" y="68" font-size="17">Initial recruitment frame · published Figure 1</text><text x="450" y="138">2,506 ineligible + 27 declined consent</text><text x="450" y="162" font-size="17">See exclusion reasons in the table below</text><text x="450" y="240">4,556 infants randomized</text><text x="450" y="263" font-size="17">Individual assignment · 1:1 · village blocks of four</text><text x="225" y="347">2,278 placebo</text><text x="675" y="347">2,278 synbiotic</text><text x="225" y="370" font-size="17">Assigned and included in reproduction</text><text x="675" y="370" font-size="17">Assigned and included in reproduction</text></g><g font-size="19"><text x="225" y="444">2,185 completed · 13 withdrawn</text><text x="225" y="475">76 lost to follow-up · 4 deaths</text><text x="675" y="444">2,141 completed · 19 withdrawn</text><text x="675" y="475">112 lost to follow-up · 6 deaths</text><text x="450" y="569" font-size="17">Reproduced binary analysis: every assigned row, n = 4,556</text></g></g></svg>
