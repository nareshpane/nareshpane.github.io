<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" role="img" aria-labelledby="title desc"><title id="title">Two oral treatment strategies and the day-60 follow-up horizon</title><desc id="desc">Balanced panels depict oral delivery without infusion. A common age scale shows an enrollment window and seven doses, followed by surveillance.</desc><rect width="100%" height="100%" fill="#fffefa"/><g font-family="Inter,Arial,sans-serif" stroke-width="1.5"><text x="28" y="30" font-size="23" text-anchor="start" fill="#344750" font-weight="600">Matched allocation procedures; different assigned content</text><rect x="25" y="50" width="460" height="144" rx="12" fill="#eff7fc" stroke="#bfd6e4"/><text x="47" y="80" font-size="21" text-anchor="start" fill="#344750" font-weight="600">Synbiotic</text><text x="47" y="106" font-size="17" text-anchor="start" fill="#344750" font-weight="400">L. plantarum + FOS</text><rect x="48" y="122" width="66" height="46" rx="6" fill="#fffefa" stroke="#9aafb6"/><text x="81" y="150" font-size="12" text-anchor="middle" fill="#344750" font-weight="400">CODE</text><g transform="translate(373 129) scale(0.9)"><path d="M-31 0Q0-21 32 1L44 34Q10 57-27 32Z" fill="#d7e8dc" stroke="#344750" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="-3" r="15" fill="#e0b59b" stroke="#344750"/><path d="M-3-9Q9-21 21-8" fill="none" stroke="#7b5b50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3-3H5M14-3H16M7 5Q11 8 15 5" fill="none" stroke="#344750" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M-20 8L27 27M-16 27L7 12" fill="none" stroke="#849fa7" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M166 134H256M173 121V147M187 124H241V144H187Z M243 133H277" fill="none" stroke="#5b8fae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M279 133L297 133M291 127L298 133L291 139" fill="none" stroke="#5b8fae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170" y="174" font-size="14" text-anchor="start" fill="#344750" font-weight="400">Oral, needle-free delivery</text><rect x="515" y="50" width="460" height="144" rx="12" fill="#fff5ed" stroke="#e2cdbb"/><text x="537" y="80" font-size="21" text-anchor="start" fill="#344750" font-weight="600">Placebo</text><text x="537" y="106" font-size="17" text-anchor="start" fill="#344750" font-weight="400">Maltodextrin</text><rect x="538" y="122" width="66" height="46" rx="6" fill="#fffefa" stroke="#9aafb6"/><text x="571" y="150" font-size="12" text-anchor="middle" fill="#344750" font-weight="400">CODE</text><g transform="translate(863 129) scale(0.9)"><path d="M-31 0Q0-21 32 1L44 34Q10 57-27 32Z" fill="#d7e8dc" stroke="#344750" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="-3" r="15" fill="#e0b59b" stroke="#344750"/><path d="M-3-9Q9-21 21-8" fill="none" stroke="#7b5b50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3-3H5M14-3H16M7 5Q11 8 15 5" fill="none" stroke="#344750" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M-20 8L27 27M-16 27L7 12" fill="none" stroke="#849fa7" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M656 134H746M663 121V147M677 124H731V144H677Z M733 133H767" fill="none" stroke="#d8a687" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M769 133L787 133M781 127L788 133L781 139" fill="none" stroke="#d8a687" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="660" y="174" font-size="14" text-anchor="start" fill="#344750" font-weight="400">Oral, needle-free delivery</text><text x="28" y="227" font-size="17" text-anchor="start" fill="#344750" font-weight="400">Age scale: treatment starts after enrollment, surveillance continues to day 60</text><path d="M65.0 282H935.0" fill="none" stroke="#91a4a2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="79.5" y="265" width="130.5" height="30" rx="5" fill="#d7e9d8" stroke="#a5c6aa"/><path d="M65.0 277V291" fill="none" stroke="#344750" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="65.0" y="314" font-size="16" text-anchor="middle" fill="#344750" font-weight="400">0 d</text><path d="M210.0 277V291" fill="none" stroke="#344750" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="210.0" y="314" font-size="16" text-anchor="middle" fill="#344750" font-weight="400">10 d</text><path d="M500.0 277V291" fill="none" stroke="#344750" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="314" font-size="16" text-anchor="middle" fill="#344750" font-weight="400">30 d</text><path d="M935.0 277V291" fill="none" stroke="#344750" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="935.0" y="314" font-size="16" text-anchor="middle" fill="#344750" font-weight="400">60 d</text><text x="65" y="252" font-size="15" text-anchor="start" fill="#344750" font-weight="400">Enroll 1–4 d → seven daily doses</text><text x="580" y="252" font-size="15" text-anchor="start" fill="#344750" font-weight="400">Daily monitoring / clinical referral</text><text x="28" y="347" font-size="14" text-anchor="start" fill="#344750" font-weight="400">Schematic kits reveal content for teaching; actual allocation was masked. Dosing ends around age 7–10 days.</text></g></svg>