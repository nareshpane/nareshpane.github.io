<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 275" role="img" aria-labelledby="title desc"><title id="title">One infant, two potential assignment outcomes</title><desc id="desc">A conceptual, synthetic infant links two assignment worlds. The two possible outcomes cannot both be observed for that infant.</desc><rect width="100%" height="100%" fill="#fffefa"/><g font-family="Inter,Arial,sans-serif" stroke-width="1.5"><rect x="20" y="40" width="300" height="175" rx="12" fill="#eff7fc" stroke="#c5d8e2"/><rect x="580" y="40" width="300" height="175" rx="12" fill="#fff5ed" stroke="#e2cdbb"/><g transform="translate(450 111) scale(1.1)"><path d="M-31 0Q0-21 32 1L44 34Q10 57-27 32Z" fill="#c6dcdf" stroke="#344750" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="-3" r="15" fill="#e0b59b" stroke="#344750"/><path d="M-3-9Q9-21 21-8" fill="none" stroke="#7b5b50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3-3H5M14-3H16M7 5Q11 8 15 5" fill="none" stroke="#344750" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M-20 8L27 27M-16 27L7 12" fill="none" stroke="#849fa7" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="450" y="190" font-size="18" text-anchor="middle" fill="#344750" font-weight="600">One synthetic infant</text><path d="M408 110H334M491 110H568" fill="none" stroke="#344750" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="45" y="73" font-size="18" text-anchor="start" fill="#344750" font-weight="600">Assigned synbiotic: Z = 1</text><text x="45" y="110" font-size="18" text-anchor="start" fill="#344750" font-weight="400">Yᵢ(1) = adverse event by day 60?</text><text x="45" y="152" font-size="14" text-anchor="start" fill="#344750" font-weight="400">Observed only if assigned this strategy</text><text x="605" y="73" font-size="18" text-anchor="start" fill="#344750" font-weight="600">Assigned placebo: Z = 0</text><text x="605" y="110" font-size="18" text-anchor="start" fill="#344750" font-weight="400">Yᵢ(0) = adverse event by day 60?</text><text x="605" y="152" font-size="14" text-anchor="start" fill="#344750" font-weight="400">The alternative outcome stays unobserved</text><text x="450" y="248" font-size="17" text-anchor="middle" fill="#344750" font-weight="400">Randomization compares groups. It never reveals both outcomes for one infant.</text></g></svg>