<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A browser-based spreadsheet interface for learning how Excel formulas work.">
  <title>Excel Function Simulator</title>
  <link rel="stylesheet" href="excel-function-simulator/style.css">
  <script defer src="excel-function-simulator/criteria.js"></script>
  <script defer src="excel-function-simulator/lookup.js"></script>
  <script defer src="excel-function-simulator/formatting.js"></script>
  <script defer src="excel-function-simulator/formulas.js"></script>
  <script defer src="excel-function-simulator/explanations.js"></script>
  <script defer src="excel-function-simulator/functions.js"></script>
  <script defer src="excel-function-simulator/exercises.js"></script>
  <script defer src="excel-function-simulator/simulator.js"></script>
  <script defer src="excel-function-simulator/formula-editor.js"></script>
  <script defer src="excel-function-simulator/practice.js"></script>
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <h1>Excel Function Simulator</h1>
      <p>Learn formulas by watching them work.</p>
    </header>

    <div class="mode-toolbar" aria-label="Simulator mode">
      <div id="mode-switcher" class="mode-switcher">
        <button class="mode-button active" type="button" data-mode="playground" aria-pressed="true">Playground</button>
        <button class="mode-button" type="button" data-mode="learn" aria-pressed="false">Learn</button>
        <button class="mode-button" type="button" data-mode="practice" aria-pressed="false">Practice</button>
      </div>
    </div>

    <div class="workspace-layout">
      <section class="spreadsheet-app" aria-label="Spreadsheet simulator">
        <div class="number-format-toolbar" aria-label="Number formatting">
          <label class="number-format-select-wrap">
            <span class="visually-hidden">Number format</span>
            <select id="number-format-select" class="number-format-select">
              <option value="General">General</option>
              <option value="Number">Number</option>
              <option value="Currency">Currency</option>
              <option value="Percentage">Percentage</option>
              <option value="Date">Date</option>
            </select>
          </label>
          <button id="currency-format-button" class="format-tool-button" type="button" title="Currency" aria-label="Apply Currency format">$</button>
          <button id="percentage-format-button" class="format-tool-button" type="button" title="Percentage" aria-label="Apply Percentage format">%</button>
          <button id="number-format-button" class="format-tool-button" type="button" title="Number with thousands separator" aria-label="Apply Number format with thousands separator">,</button>
          <span class="format-tool-divider" aria-hidden="true"></span>
          <button id="decrease-decimal-button" class="format-tool-button decimal-tool" type="button" title="Decrease Decimal" aria-label="Decrease decimal places">.0</button>
          <button id="increase-decimal-button" class="format-tool-button decimal-tool" type="button" title="Increase Decimal" aria-label="Increase decimal places">.00</button>
        </div>
        <div class="formula-controls">
          <label class="name-box-wrap">
            <span class="visually-hidden">Selected cell</span>
            <input id="name-box" class="name-box" type="text" value="A1" readonly>
          </label>
          <button id="formula-function-button" class="formula-symbol" type="button" aria-label="Insert function" aria-expanded="false">fx</button>
          <label class="formula-input-wrap">
            <span class="visually-hidden">Cell content</span>
            <input id="formula-input" class="formula-input" type="text" autocomplete="off" spellcheck="false">
          </label>
        </div>

        <div class="grid-viewport">
          <div
            id="spreadsheet-grid"
            class="spreadsheet-grid"
            role="grid"
            aria-label="Spreadsheet with 50 rows and 26 columns"
            aria-rowcount="50"
            aria-colcount="26"
          ></div>
        </div>

        <div class="workbook-bar">
          <div class="sheet-strip" aria-label="Worksheet tabs">
            <button class="add-sheet-button" type="button" title="Add worksheet (coming later)" aria-label="Add worksheet">+</button>
            <button class="sheet-tab active-sheet" type="button" aria-current="page">Sheet1</button>
          </div>
          <div class="status-info">
            <span>Ready</span>
            <span id="selection-status" aria-live="polite">Selected: A1</span>
          </div>
        </div>
      </section>

      <aside id="formula-explorer" class="function-explorer" aria-label="Learning and formula explorer">
        <section id="learning-panel" hidden></section>
        <section id="trace-panel">
          <h2 id="function-explorer-title">Function Explorer</h2>
          <div id="explorer-content">
            <p>Select a formula cell to see how it works.</p>
          </div>
        </section>
      </aside>
    </div>

    <footer class="footer-nav">
      <a href="../index.html">Home</a>
      <span aria-hidden="true">|</span>
      <a href="../research.html">Research</a>
    </footer>

    <noscript>This simulator requires JavaScript for cell editing and navigation.</noscript>
  </main>
</body>
</html>
